<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penmoss Prototype</title>
<meta name="description" content="Clickable prototype of Penmoss, a calm, offline-first personal notes app. All data is fake sample data.">
<style>
/* ==========================================================================
   Tokens. Core tokens are rewritten at runtime by the theme engine; derived
   tokens are computed from core tokens with color-mix so every theme gets
   consistent hover, selection, diff and code surfaces.
   ========================================================================== */
:root {
  color-scheme: light;
  /* core: Penmoss light */
  --bg: #f5f4ef;
  --sidebar: #eeede6;
  --surface: #fbfaf6;
  --raised: #ffffff;
  --border: #e0ded5;
  --text: #22251f;
  --text2: #565a50;
  --text3: #686c60;
  --accent: #56703f;
  --on-accent: #fbfaf6;
  --link: #4a6837;
  --mark: #e7eac0;
  --danger: #b04a3c;
  --success: #4e7a3c;
  --warn: #9c7a2c;
  --agent: #3d7a83;
  --shadow: #20251c;
  --kw: #87506f;
  --str: #557535;
  --com: #969a8c;
  --num: #a05f2a;
  --type: #2f6e78;
  --fn: #3e5e8a;
  --g1: #8f8a55;
  --g2: #56703f;
  --g3: #a46d3a;
  --g4: #4c7186;
  --g5: #8a6681;

  /* derived */
  --hover: color-mix(in oklab, var(--text) 5%, transparent);
  --active: color-mix(in oklab, var(--text) 9%, transparent);
  --accent-soft: color-mix(in oklab, var(--accent) 15%, transparent);
  --accent-softer: color-mix(in oklab, var(--accent) 8%, transparent);
  --accent-line: color-mix(in oklab, var(--accent) 45%, transparent);
  --border-strong: color-mix(in oklab, var(--border), var(--text) 15%);
  --border-soft: color-mix(in oklab, var(--border), var(--surface) 45%);
  --code-bg: color-mix(in oklab, var(--surface), var(--text) 4%);
  --inline-code-bg: color-mix(in oklab, var(--surface), var(--text) 7%);
  --add-bg: color-mix(in oklab, var(--success) 15%, transparent);
  --del-bg: color-mix(in oklab, var(--danger) 13%, transparent);
  --agent-soft: color-mix(in oklab, var(--agent) 14%, transparent);
  --warn-soft: color-mix(in oklab, var(--warn) 14%, transparent);
  --danger-soft: color-mix(in oklab, var(--danger) 12%, transparent);
  --scrim: color-mix(in oklab, var(--shadow) 30%, transparent);
  --shadow-1: 0 1px 2px color-mix(in oklab, var(--shadow) 8%, transparent);
  --shadow-2: 0 1px 2px color-mix(in oklab, var(--shadow) 8%, transparent), 0 8px 24px -6px color-mix(in oklab, var(--shadow) 20%, transparent);
  --shadow-3: 0 0 0 1px color-mix(in oklab, var(--shadow) 6%, transparent), 0 24px 64px -12px color-mix(in oklab, var(--shadow) 34%, transparent);
  --focus: color-mix(in oklab, var(--accent) 70%, var(--text));
  --sel: color-mix(in oklab, var(--accent) 24%, transparent);

  /* type */
  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Liberation Sans", Arial, sans-serif;
  --font-serif: ui-serif, "Iowan Old Style", "Charter", "Source Serif Pro", Georgia, "Liberation Serif", serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --font-editor: var(--font-ui);
  --measure: 70ch;

  /* shape and space */
  --r1: 4px; --r2: 6px; --r3: 8px; --r4: 12px;
  --ease: cubic-bezier(.2,.7,.2,1);
  --t-fast: 120ms; --t-med: 200ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-mode="light"]) {
    color-scheme: dark;
    --bg: #171b17; --sidebar: #131613; --surface: #1b201b; --raised: #232923; --border: #2d342c;
    --text: #e2e5da; --text2: #a8ad9e; --text3: #858c7d; --accent: #93ae79; --on-accent: #111510;
    --link: #a9c48e; --mark: #3b4428; --danger: #df7f6e; --success: #8db974; --warn: #d4ad61; --agent: #6fb3bc; --shadow: #000000;
    --kw: #d39abf; --str: #a8c889; --com: #6d7467; --num: #e2a46c; --type: #79b7c0; --fn: #93b1dc;
    --g1: #bdb67a; --g2: #93ae79; --g3: #d5995f; --g4: #7ea6bd; --g5: #bc95b0;
  }
}
:root[data-mode="dark"] { color-scheme: dark; }

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow: hidden;
}
::selection { background: var(--sel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--link); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; border-radius: var(--r1); }
.sb-item:focus-visible, .note-item:focus-visible, .opt:focus-visible, .res:focus-visible, .ph-li:focus-visible, .ver:focus-visible { outline-offset: -2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 14px; height: 14px; }
svg.i.xs { width: 12px; height: 12px; }
kbd, .kbd {
  font: 500 11px/1 var(--font-ui); color: var(--text2); background: var(--surface);
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: var(--r1); padding: 2px 5px; min-width: 18px; text-align: center; display: inline-block;
}
.keys { display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; }
.muted { color: var(--text3); }
.scroll { overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: var(--r2); white-space: nowrap; flex: none;
  border: 1px solid var(--border); background: var(--raised); color: var(--text); font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-1); transition: background var(--t-fast), border-color var(--t-fast);
}
.btn:hover { border-color: var(--border-strong); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: color-mix(in oklab, var(--accent), var(--text) 12%); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover { background: var(--hover); }
.btn[disabled] { opacity: .55; cursor: default; }
.icon-btn {
  width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r2); color: var(--text2);
  transition: background var(--t-fast), color var(--t-fast);
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn[aria-pressed="true"], .icon-btn[aria-expanded="true"] { background: var(--active); color: var(--text); }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--hover); border-radius: var(--r2); border: 1px solid var(--border-soft); }
.seg button { height: 24px; padding: 0 10px; border-radius: var(--r1); font-size: 12.5px; color: var(--text2); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--raised); color: var(--text); box-shadow: var(--shadow-1); }
.input {
  height: 30px; padding: 0 10px; border: 1px solid var(--border); background: var(--raised); border-radius: var(--r2); width: 100%;
  font-size: 13px; transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.input:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-softer); }
select.input { padding-right: 6px; }
.switch { position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--border-strong); transition: background var(--t-fast); flex: none; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--raised); box-shadow: var(--shadow-1); transition: transform var(--t-fast) var(--ease); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(12px); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11.5px; font-weight: 500;
  background: var(--accent-softer); color: var(--link); white-space: nowrap; border: 1px solid transparent;
}
button.chip:hover { background: var(--accent-soft); }
.chip.neutral { background: var(--hover); color: var(--text2); }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: currentColor; flex: none; }

/* ==========================================================================
   App shell
   ========================================================================== */
.app {
  --sb: 240px; --ls: 288px; --pn: 280px;
  display: grid; grid-template-columns: var(--sb) var(--ls) minmax(0,1fr) var(--pn);
  height: 100vh; height: 100dvh; transition: grid-template-columns var(--t-med) var(--ease);
}
.app[data-sidebar="closed"] { --sb: 0px; }
.app[data-panel="closed"] { --pn: 0px; }
.app[data-view="graph"] { --ls: 0px; --pn: 0px; }
.app > * { min-width: 0; min-height: 0; overflow: hidden; }
.app[data-sidebar="closed"] .sidebar, .app[data-panel="closed"] .panel, .app[data-view="graph"] .panel, .app[data-view="graph"] .list { visibility: hidden; }

/* Sidebar */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sb-head { display: flex; align-items: center; gap: 4px; padding: 12px 8px 6px 14px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -.01em; font-size: 14px; flex: 1; min-width: 0; }
.brand-mark { width: 20px; height: 20px; flex: none; }
.sb-status { padding: 0 12px 8px 12px; }
.sync-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 500;
  color: var(--text2); background: var(--hover); white-space: nowrap; border: 1px solid transparent; max-width: 100%;
}
.sync-pill:hover { border-color: var(--border-strong); }
.sync-pill .dot { color: var(--success); }
.sync-pill[data-state="syncing"] .dot { color: var(--accent); animation: pulse 1s ease-in-out infinite; }
.sync-pill[data-state="offline"] { color: var(--warn); background: var(--warn-soft); }
.sync-pill[data-state="offline"] .dot { color: var(--warn); }
.sync-pill span { overflow: hidden; text-overflow: ellipsis; }
@keyframes pulse { 50% { opacity: .35; } }
.sb-body { flex: 1; padding: 4px 8px 12px; }
.sb-actions { display: grid; gap: 1px; margin-bottom: 10px; }
.sb-item {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: var(--r2);
  color: var(--text2); font-size: 13px; text-align: left; white-space: nowrap;
}
.sb-item:hover { background: var(--hover); color: var(--text); }
.sb-item[aria-current="true"] { background: var(--active); color: var(--text); font-weight: 500; }
.sb-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.sb-item .count { font-size: 11.5px; color: var(--text3); font-variant-numeric: tabular-nums; }
.sb-item .keys { opacity: 0; transition: opacity var(--t-fast); }
.sb-item:hover .keys, .sb-item:focus-visible .keys { opacity: 1; }
.sb-item .keys kbd { background: transparent; border-color: var(--border); }
.sb-section { margin-top: 14px; }
.sb-section-h {
  display: flex; align-items: center; justify-content: space-between; padding: 0 8px; height: 24px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text3);
}
.sb-section-h .icon-btn { width: 22px; height: 22px; }
.tree .sb-item { padding-left: calc(4px + var(--depth, 0) * 14px); gap: 4px; }
.tree .twisty { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text3); flex: none; transition: transform var(--t-fast) var(--ease); }
.tree .twisty[data-open="true"] { transform: rotate(90deg); }
.tree .twisty.blank { visibility: hidden; }
.tree .fi { color: var(--text3); margin-right: 2px; }
.sb-item[aria-current="true"] .fi { color: var(--accent); }
.sb-foot { padding: 8px 10px 10px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 4px; }
.sb-foot .who { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); min-width: 0; }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 650; background: var(--accent-soft); color: var(--link); flex: none; }

/* Mini calendar */
.cal { padding: 4px 4px 2px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 4px; }
.cal-h .m { font-size: 12.5px; font-weight: 600; }
.cal-h .icon-btn { width: 22px; height: 22px; }
.cal-grid { display: grid; grid-template-columns: 22px repeat(7, 1fr); gap: 1px; font-size: 11.5px; text-align: center; font-variant-numeric: tabular-nums; }
.cal-grid .dow { color: var(--text3); font-size: 10.5px; height: 18px; line-height: 18px; }
.cal-grid .wk { color: var(--text3); font-size: 10px; height: 26px; line-height: 26px; border-radius: var(--r1); }
.cal-grid button.wk:hover { background: var(--hover); color: var(--text); }
.cal-day {
  position: relative; height: 26px; border-radius: var(--r1); color: var(--text2); display: grid; place-items: center;
}
.cal-day:hover { background: var(--hover); color: var(--text); }
.cal-day.out { color: var(--text3); opacity: .55; }
.cal-day.has::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 3px; height: 3px; margin-left: -1.5px; border-radius: 50%; background: var(--accent); }
.cal-day.today { color: var(--accent); font-weight: 700; box-shadow: inset 0 0 0 1px var(--accent-line); }
.cal-day.sel { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.cal-day.sel::after { background: var(--on-accent); }

/* Note list */
.list { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.list-h { padding: 10px 10px 8px 16px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border-soft); min-height: 48px; }
.list-h .title { flex: 1; min-width: 0; }
.list-h .title h2 { font-size: 14px; margin: 0; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.005em; }
.list-h .title .sub { font-size: 11.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sort-btn { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: var(--r2); color: var(--text2); font-size: 12px; }
.sort-btn:hover, .sort-btn[aria-expanded="true"] { background: var(--hover); color: var(--text); }
.notes { flex: 1; padding: 6px; position: relative; }
.note-item {
  position: relative; display: block; width: 100%; text-align: left; padding: 10px 10px 10px 12px; border-radius: var(--r3);
  border: 1px solid transparent; margin-bottom: 2px; user-select: none; touch-action: pan-y;
}
.note-item:hover { background: var(--hover); }
.note-item[aria-current="true"] { background: var(--raised); border-color: var(--border); box-shadow: var(--shadow-1); }
.note-item[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 2px; border-radius: 2px; background: var(--accent); }
.note-item .t { font-weight: 600; font-size: 13.5px; display: flex; gap: 6px; align-items: baseline; }
.note-item .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.note-item .t time { font-weight: 400; font-size: 11.5px; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.note-item .s { font-size: 12.5px; color: var(--text2); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }
.note-item .m { display: flex; gap: 4px; margin-top: 7px; align-items: center; flex-wrap: wrap; }
.note-item .m .path { font-size: 11px; color: var(--text3); margin-right: 4px; }
.notes[data-sort="manual"] .note-item { cursor: grab; }
.note-item .grip { position: absolute; left: -2px; top: 50%; translate: 0 -50%; color: var(--text3); opacity: 0; }
.notes[data-sort="manual"] .note-item:hover .grip { opacity: .8; }
.note-item.dragging { opacity: .35; }
.drag-ghost {
  position: fixed; z-index: 90; pointer-events: none; width: 260px; padding: 8px 12px; border-radius: var(--r3); background: var(--raised);
  border: 1px solid var(--border-strong); box-shadow: var(--shadow-2); font-weight: 600; font-size: 13px; rotate: -1.5deg;
}
.drop-line { position: absolute; left: 10px; right: 10px; height: 2px; background: var(--accent); border-radius: 2px; pointer-events: none; z-index: 5; display: none; }
.drop-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); }
.empty { text-align: center; padding: 48px 24px; color: var(--text2); }
.empty svg.art { width: 72px; height: 72px; color: var(--text3); margin-bottom: 8px; }
.empty h3 { font-size: 14px; margin: 4px 0; color: var(--text); }
.empty p { font-size: 12.5px; margin: 0 0 14px; }

/* Editor pane */
.main { background: var(--bg); display: flex; flex-direction: column; position: relative; }
.ed-top { display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--border-soft); flex: none; }
.crumbs { display: flex; align-items: center; gap: 2px; font-size: 12.5px; color: var(--text3); min-width: 0; flex: 1; overflow: hidden; white-space: nowrap; }
.crumbs button { padding: 2px 5px; border-radius: var(--r1); color: var(--text3); }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs .cur { color: var(--text2); padding: 2px 5px; overflow: hidden; text-overflow: ellipsis; }
.crumbs svg { color: var(--text3); opacity: .6; }
.ed-actions { display: flex; align-items: center; gap: 2px; }
.ed-actions .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
.offline-banner {
  display: none; align-items: center; gap: 8px; padding: 7px 16px; font-size: 12.5px; color: var(--warn); background: var(--warn-soft);
  border-bottom: 1px solid color-mix(in oklab, var(--warn) 25%, transparent);
}
.app[data-online="false"] .offline-banner { display: flex; }
.ed-scroll { flex: 1; position: relative; }
.doc { max-width: calc(var(--measure) + 96px); margin: 0 auto; padding: 36px 48px 160px; position: relative; }
.doc-head { margin-bottom: 18px; }
.daynav { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 12px; color: var(--text3); }
.daynav .icon-btn { width: 24px; height: 24px; }
.doc-title {
  font: 700 30px/1.2 var(--font-editor); letter-spacing: -.02em; margin: 0 0 10px; outline: none; color: var(--text);
}
.doc-title:empty::before { content: "Untitled"; color: var(--text3); }
.meta { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--text3); }
.meta .dates { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.meta .tags { display: flex; gap: 4px; flex-wrap: wrap; }
.meta .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); }
.meta .dev { display: inline-flex; gap: 4px; align-items: center; }

.welcome {
  border: 1px solid var(--border); background: var(--surface); border-radius: var(--r3); padding: 14px 16px 12px; margin: 0 0 24px; position: relative;
  box-shadow: var(--shadow-1);
}
.welcome h2 { margin: 0 0 2px; font-size: 13.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.welcome p { margin: 0 0 10px; font-size: 12.5px; color: var(--text2); }
.welcome ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; }
.welcome li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); min-height: 26px; }
.welcome li .keys { min-width: 58px; }
.welcome li button.linkish { color: var(--link); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--accent-line); }
.welcome .close { position: absolute; top: 8px; right: 8px; }

/* Rich editor content */
.editor {
  font-family: var(--font-editor); font-size: 16px; line-height: 1.7; color: var(--text); outline: none; caret-color: var(--accent);
  overflow-wrap: anywhere; position: relative;
}
.editor > * { margin: 0 0 .85em; }
.editor h1, .editor h2, .editor h3 { line-height: 1.3; letter-spacing: -.015em; font-weight: 680; }
.editor h1 { font-size: 1.6em; margin-top: 1.4em; }
.editor h2 { font-size: 1.28em; margin-top: 1.6em; margin-bottom: .5em; }
.editor h3 { font-size: 1.07em; margin-top: 1.3em; margin-bottom: .35em; }
.editor > :first-child { margin-top: 0; }
.editor p:empty::before, .editor p:has(> br:only-child)::before { content: attr(data-ph); color: var(--text3); pointer-events: none; }
.editor.is-empty > p:first-child::before { content: "Start writing, or type / for blocks"; color: var(--text3); }
.editor strong, .editor b { font-weight: 650; }
.editor code {
  font-family: var(--font-mono); font-size: .86em; padding: .12em .36em; border-radius: var(--r1); background: var(--inline-code-bg); color: var(--text);
  border: 1px solid var(--border-soft);
}
.editor mark { background: var(--mark); color: inherit; padding: 0 .1em; border-radius: 2px; }
.editor a { color: var(--link); text-decoration: underline; text-decoration-color: var(--accent-line); text-underline-offset: 3px; }
.editor a.wikilink { text-decoration: none; border-bottom: 1px solid var(--accent-line); cursor: pointer; font-weight: 500; }
.editor a.wikilink:hover { background: var(--accent-softer); }
.editor a.wikilink.unresolved { color: var(--text2); border-bottom-style: dashed; border-bottom-color: var(--border-strong); }
.editor .tag { color: var(--link); background: var(--accent-softer); border-radius: var(--r1); padding: 0 .25em; font-size: .92em; cursor: pointer; }
.editor ul, .editor ol { padding-left: 1.5em; }
.editor li { margin: .2em 0; padding-left: .2em; }
.editor li::marker { color: var(--text3); }
.editor ul.checklist { list-style: none; padding-left: .1em; }
.editor ul.checklist li { display: flex; gap: .55em; align-items: flex-start; padding-left: 0; }
.editor ul.checklist li > .lt { flex: 1; min-width: 0; }
.cbx {
  width: 17px; height: 17px; margin-top: .3em; border-radius: 5px; border: 1.5px solid var(--border-strong); background: var(--raised); flex: none;
  display: grid; place-items: center; color: var(--on-accent); transition: background var(--t-fast), border-color var(--t-fast); user-select: none;
}
.cbx svg { width: 11px; height: 11px; stroke-width: 2.4; opacity: 0; }
.cbx:hover { border-color: var(--accent); }
.cbx[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.cbx[aria-checked="true"] svg { opacity: 1; }
.editor ul.checklist li[data-checked="true"] > .lt { color: var(--text3); text-decoration: line-through; text-decoration-color: var(--border-strong); }
.editor hr { border: 0; height: 1px; background: var(--border); margin: 2em 0; }
.editor blockquote { border-left: 2px solid var(--border-strong); margin-left: 0; padding-left: 1em; color: var(--text2); }

.editor .code {
  border: 1px solid var(--border); border-radius: var(--r3); background: var(--code-bg); overflow: hidden; font-size: 13.5px;
}
.code-h { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--border-soft); font: 500 11.5px/1 var(--font-ui); color: var(--text3); user-select: none; }
.code-h .lang { text-transform: none; letter-spacing: .02em; display: inline-flex; gap: 6px; align-items: center; }
.code-h .btn { height: 24px; padding: 0 8px; font-size: 11.5px; box-shadow: none; background: transparent; border-color: transparent; color: var(--text2); }
.code-h .btn:hover { background: var(--hover); }
.editor pre { margin: 0; padding: 12px 14px 14px; overflow-x: auto; font-family: var(--font-mono); line-height: 1.6; tab-size: 2; }
.editor pre code { background: none; border: 0; padding: 0; font-size: inherit; display: block; outline: none; white-space: pre; }
.tok-kw { color: var(--kw); }
.tok-str { color: var(--str); }
.tok-com { color: var(--com); font-style: italic; }
.tok-num { color: var(--num); }
.tok-type { color: var(--type); }
.tok-fn { color: var(--fn); }
.tok-punc { color: var(--text2); }

.editor figure { margin: 1.4em 0; }
.editor figure .frame { border: 1px solid var(--border); border-radius: var(--r3); background: var(--surface); overflow: hidden; }
.editor figure svg.art { display: block; width: 100%; height: auto; }
.editor figure img { display: block; max-width: 100%; height: auto; border-radius: var(--r3); border: 1px solid var(--border); }
.editor figcaption { font: 12.5px/1.5 var(--font-ui); color: var(--text3); margin-top: 8px; text-align: center; }

.callout {
  --c: var(--agent); border: 1px solid color-mix(in oklab, var(--c) 28%, transparent); background: color-mix(in oklab, var(--c) 7%, var(--bg));
  border-radius: var(--r3); padding: 10px 14px 10px 14px;
}
.callout[data-kind="tip"] { --c: var(--success); }
.callout[data-kind="warning"] { --c: var(--warn); }
.callout[data-kind="faq"], .callout[data-kind="question"] { --c: var(--g4); }
.callout-t { display: flex; align-items: center; gap: 8px; font: 600 14px/1.5 var(--font-ui); color: color-mix(in oklab, var(--c) 80%, var(--text)); }
.callout-t svg { color: var(--c); }
.callout-b { margin-top: 2px; font-size: .95em; }
.callout-b > p { margin: .3em 0 0; }
details.callout > summary { list-style: none; cursor: pointer; user-select: none; }
details.callout > summary::-webkit-details-marker { display: none; }
details.callout > summary .chev { margin-left: auto; transition: transform var(--t-fast) var(--ease); color: var(--text3); }
details.callout[open] > summary .chev { transform: rotate(90deg); }

.editor .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r3); }
.editor table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
.editor th, .editor td { padding: 7px 12px; border-bottom: 1px solid var(--border-soft); text-align: left; vertical-align: top; }
.editor th { font: 600 12px/1.5 var(--font-ui); color: var(--text2); background: var(--code-bg); letter-spacing: .01em; }
.editor tr:last-child td { border-bottom: 0; }
.editor td + td, .editor th + th { border-left: 1px solid var(--border-soft); }
.editor td.num, .editor th.num { text-align: right; }

.mermaid { border: 1px solid var(--border); border-radius: var(--r3); background: var(--surface); padding: 6px 10px 10px; }
.block-label { display: flex; align-items: center; justify-content: space-between; font: 500 11.5px/1 var(--font-ui); color: var(--text3); height: 24px; user-select: none; }
.mermaid svg { display: block; width: 100%; height: auto; font-family: var(--font-ui); }
.mm-node rect, .mm-node path.shape { fill: var(--raised); stroke: var(--border-strong); stroke-width: 1; }
.mm-node.hl rect, .mm-node.hl path.shape { fill: var(--accent-softer); stroke: var(--accent); }
.mm-node text { fill: var(--text); font-size: 12px; font-weight: 500; }
.mm-node text.sub { fill: var(--text3); font-size: 10.5px; font-weight: 400; }
.mm-edge { fill: none; stroke: var(--text3); stroke-width: 1.2; }
.mm-edge-label { fill: var(--text3); font-size: 10.5px; }
.mm-arrow { fill: var(--text3); }

.math-block { text-align: center; padding: .6em 0; font-size: 1.12em; overflow-x: auto; }
.math-block math { display: block; }
.math-inline { white-space: nowrap; }
math { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", var(--font-serif); }

.embed { border: 1px solid var(--border); border-left: 2px solid var(--accent-line); border-radius: var(--r3); background: var(--surface); padding: 10px 16px 12px; font-size: .94em; }
.embed-h { display: flex; align-items: center; gap: 8px; font: 500 12px/1 var(--font-ui); color: var(--text3); height: 26px; user-select: none; }
.embed-h .src { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.embed-h .btn { height: 24px; font-size: 12px; padding: 0 8px; }
.embed-b h3 { margin: .3em 0 .3em; font-size: 1.05em; }
.embed-b > * { margin: 0 0 .5em; }
.embed-b > :last-child { margin-bottom: 0; }

.attach {
  display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border: 1px solid var(--border); border-radius: var(--r3);
  background: var(--surface); max-width: 380px; font-family: var(--font-ui); cursor: pointer; user-select: none;
}
.attach:hover { border-color: var(--border-strong); }
.attach .ft { width: 34px; height: 40px; flex: none; }
.attach .n { font-size: 13px; font-weight: 600; line-height: 1.3; }
.attach .d { font-size: 11.5px; color: var(--text3); }

/* agent attribution */
.agent-new { position: relative; border-radius: var(--r2); background: var(--agent-soft); box-shadow: -10px 0 0 var(--agent-soft), 10px 0 0 var(--agent-soft), inset 0 0 0 0 transparent; transition: background 1.2s var(--ease), box-shadow 1.2s var(--ease); }
.agent-new.fading { background: transparent; box-shadow: -10px 0 0 transparent, 10px 0 0 transparent; }
.agent-label {
  position: absolute; right: 0; top: -1.35em; display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 9px;
  font: 600 10.5px/16px var(--font-ui); color: var(--on-accent); background: var(--agent); user-select: none; white-space: nowrap;
}
.agent-new.fading .agent-label { opacity: 0; transition: opacity 1.2s; }

/* Hover handle + floating UI */
.block-handle {
  position: absolute; left: 14px; width: 22px; height: 24px; display: grid; place-items: center; border-radius: var(--r1); color: var(--text3);
  opacity: 0; transition: opacity var(--t-fast); cursor: grab; z-index: 3;
}
.block-handle.show { opacity: 1; }
.block-handle:hover { background: var(--hover); color: var(--text2); }
.block-drop { position: absolute; height: 2px; background: var(--accent); border-radius: 2px; display: none; pointer-events: none; z-index: 3; }
.editor > .block-dragging { opacity: .4; }

.floating {
  position: fixed; z-index: 85; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r3); box-shadow: var(--shadow-2);
}
.fmtbar { display: flex; gap: 1px; padding: 3px; align-items: center; }
.fmtbar .icon-btn { width: 30px; height: 28px; }
.fmtbar .icon-btn.on { background: var(--accent-soft); color: var(--link); }
.fmtbar .sep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; }
.fmtbar input { height: 26px; border: 0; background: transparent; width: 220px; padding: 0 8px; font-size: 12.5px; outline: none; }
.menu { padding: 4px; min-width: 200px; max-height: 340px; }
.menu .mi {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 0 8px; height: 30px; border-radius: var(--r2); font-size: 13px; text-align: left; color: var(--text);
}
.menu .mi .ic { width: 22px; height: 22px; display: grid; place-items: center; color: var(--text2); border: 1px solid var(--border); border-radius: var(--r1); background: var(--surface); flex: none; }
.menu .mi.plain .ic { border: 0; background: none; width: 16px; }
.menu .mi .lbl { flex: 1; white-space: nowrap; }
.menu .mi .hint { font-size: 11.5px; color: var(--text3); }
.menu .mi:hover, .menu .mi[aria-selected="true"] { background: var(--hover); }
.menu .mi[aria-selected="true"] { background: var(--accent-softer); }
.menu .mi[aria-checked="true"] .chk { color: var(--accent); }
.menu .mi .chk { width: 16px; color: transparent; }
.menu .mh { font-size: 11px; font-weight: 600; color: var(--text3); padding: 6px 8px 4px; letter-spacing: .03em; text-transform: uppercase; }
.menu .msep { height: 1px; background: var(--border-soft); margin: 4px 0; }
.menu .mi.danger { color: var(--danger); }
.menu .none { padding: 8px; font-size: 12.5px; color: var(--text3); }

/* Source view */
.source {
  font: 13.5px/1.65 var(--font-mono); white-space: pre-wrap; word-break: break-word; outline: none; color: var(--text);
  background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--r3); padding: 18px 20px; tab-size: 2;
}
.source .fm { color: var(--text3); }
.source .fk { color: var(--type); }
.source .md-h { color: var(--text); font-weight: 700; }
.source .md-m { color: var(--accent); }
.source .md-l { color: var(--link); }
.source-note { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }

/* Right panel */
.panel { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--border-soft); height: 48px; align-items: flex-end; flex: none; }
.tabs [role="tab"] { height: 32px; padding: 0 9px; font-size: 12.5px; font-weight: 500; color: var(--text3); border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: var(--r1) var(--r1) 0 0; }
.tabs [role="tab"]:hover { color: var(--text); }
.tabs [role="tab"][aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .count { font-size: 10.5px; color: var(--text3); margin-left: 3px; }
.tabs .close-panel { margin-left: auto; align-self: center; display: none; }
.panel-body { flex: 1; padding: 12px 12px 44px; font-size: 13px; }
.outline a { display: block; padding: 4px 8px; border-radius: var(--r1); color: var(--text2); text-decoration: none; font-size: 12.5px; line-height: 1.4; border-left: 2px solid transparent; cursor: pointer; }
.outline a:hover { background: var(--hover); color: var(--text); }
.outline a.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-softer); }
.outline a[data-l="2"] { padding-left: 16px; }
.outline a[data-l="3"] { padding-left: 28px; font-size: 12px; }
.bl { padding: 10px; border: 1px solid var(--border-soft); border-radius: var(--r3); margin-bottom: 8px; background: var(--bg); }
.bl:hover { border-color: var(--border-strong); }
.bl button.t { font-weight: 600; font-size: 12.5px; display: flex; align-items: center; gap: 6px; text-align: left; color: var(--text); }
.bl .ctx { font-size: 12px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
.bl .ctx mark { background: var(--accent-soft); color: var(--text); border-radius: 2px; padding: 0 2px; }
.ph { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .04em; margin: 4px 2px 8px; }
.ver { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; padding: 8px; border-radius: var(--r2); position: relative; }
.ver:hover { background: var(--hover); }
.ver[aria-current="true"] { background: var(--accent-softer); box-shadow: inset 0 0 0 1px var(--accent-line); }
.ver .who-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--hover); color: var(--text2); }
.ver .who-ic.agent { background: var(--agent-soft); color: var(--agent); }
.ver .w { font-size: 12.5px; font-weight: 600; }
.ver .s { font-size: 12px; color: var(--text2); }
.ver .tm { font-size: 11.5px; color: var(--text3); }
.ver.new { animation: flashIn 1.4s var(--ease); }
@keyframes flashIn { from { background: var(--agent-soft); } }
.diff { margin-top: 10px; border: 1px solid var(--border); border-radius: var(--r3); overflow: hidden; background: var(--bg); }
.diff-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border-soft); font-size: 12px; }
.diff-h .stat { color: var(--text3); flex: 1; }
.diff-h .stat b.a { color: var(--success); font-weight: 600; }
.diff-h .stat b.d { color: var(--danger); font-weight: 600; }
.diff-body { font: 11.5px/1.55 var(--font-mono); max-height: 320px; overflow: auto; }
.dl { display: grid; grid-template-columns: 16px 1fr; padding: 0 8px; white-space: pre-wrap; word-break: break-word; }
.dl .g { color: var(--text3); user-select: none; }
.dl.add { background: var(--add-bg); }
.dl.add .g { color: var(--success); }
.dl.del { background: var(--del-bg); text-decoration: line-through; text-decoration-color: color-mix(in oklab, var(--danger) 45%, transparent); }
.dl.del .g { color: var(--danger); }
.dl.gap { color: var(--text3); background: var(--code-bg); text-align: center; display: block; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 12.5px; }
.kv dt { color: var(--text3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv dd code { font: 11.5px var(--font-mono); background: var(--hover); padding: 1px 4px; border-radius: var(--r1); }
.stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin: 14px 0; }
.stat-row div { border: 1px solid var(--border-soft); border-radius: var(--r2); padding: 8px; background: var(--bg); }
.stat-row b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat-row span { font-size: 11px; color: var(--text3); }

/* Graph */
.graph { position: absolute; inset: 0; display: none; background: var(--bg); }
.app[data-view="graph"] .graph { display: block; }
.app[data-view="graph"] .ed-top, .app[data-view="graph"] .ed-scroll, .app[data-view="graph"] .offline-banner { display: none; }
.graph svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.graph svg.panning { cursor: grabbing; }
.gx-edge { stroke: var(--border-strong); stroke-width: 1; vector-effect: non-scaling-stroke; transition: stroke var(--t-fast), opacity var(--t-fast); }
.gx-node circle, .gx-node rect { stroke: var(--bg); stroke-width: 1.5; vector-effect: non-scaling-stroke; transition: opacity var(--t-fast); cursor: pointer; }
.gx-node text { fill: var(--text2); font-size: calc(11.5px / var(--gk, 1)); pointer-events: none; transition: opacity var(--t-fast); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
.gx-node.tagn text { fill: var(--text3); font-size: calc(10.5px / var(--gk, 1)); }
.gx-node.cur circle { stroke: var(--text); stroke-width: 2; }
.graph.hovering .gx-node:not(.nb) { opacity: .14; }
.graph.hovering .gx-node.nb text { fill: var(--text); }
.graph.hovering .gx-edge:not(.nb) { opacity: .08; }
.graph.hovering .gx-edge.nb { stroke: var(--accent); stroke-width: 1.5; }
.graph .gx-node .lbl-min { opacity: 0; }
.graph.hovering .gx-node.nb .lbl-min, .graph.zoomed .gx-node .lbl-min { opacity: 1; }
.g-ctrl { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--raised); border: 1px solid var(--border); border-radius: var(--r3); padding: 6px 8px; box-shadow: var(--shadow-1); max-width: calc(100% - 24px); }
.g-ctrl label { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text2); cursor: pointer; }
.g-ctrl .meta-n { font-size: 11.5px; color: var(--text3); }
.g-legend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text2); background: color-mix(in oklab, var(--raised) 88%, transparent); border: 1px solid var(--border); border-radius: var(--r3); padding: 6px 10px; }
.g-legend span { display: inline-flex; align-items: center; gap: 6px; }
.g-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.g-close { position: absolute; top: 12px; right: 12px; }
.g-tip { position: absolute; pointer-events: none; padding: 6px 9px; border-radius: var(--r2); background: var(--raised); border: 1px solid var(--border); box-shadow: var(--shadow-2); font-size: 12px; display: none; max-width: 240px; }
.g-tip .p { color: var(--text3); font-size: 11px; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; background: var(--scrim); animation: fadeIn var(--t-fast) var(--ease); }
.overlay[hidden] { display: none; }
.overlay.clear { background: transparent; }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.985); } }
.dialog { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r4); box-shadow: var(--shadow-3); width: min(640px, 100%); overflow: hidden; animation: rise var(--t-med) var(--ease); display: flex; flex-direction: column; max-height: 76vh; }
.dlg-search { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 50px; border-bottom: 1px solid var(--border-soft); color: var(--text3); flex: none; }
.dlg-search input { flex: 1; border: 0; background: transparent; font-size: 15px; height: 100%; outline: none; color: var(--text); min-width: 0; }
.dlg-search input::placeholder { color: var(--text3); }
.dlg-search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.dlg-list { padding: 6px; flex: 1; min-height: 0; }
.dlg-foot { display: flex; align-items: center; gap: 14px; padding: 0 14px; height: 36px; border-top: 1px solid var(--border-soft); font-size: 11.5px; color: var(--text3); flex: none; }
.dlg-foot .keys { gap: 4px; }
.dlg-foot .grow { flex: 1; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 6px 10px; border-radius: var(--r2); text-align: left; font-size: 13.5px; }
.opt[aria-selected="true"] { background: var(--accent-softer); box-shadow: inset 0 0 0 1px var(--accent-line); }
.opt:hover:not([aria-selected="true"]) { background: var(--hover); }
.opt .oic { color: var(--text3); display: grid; place-items: center; width: 18px; }
.opt .ot { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .ot .p { color: var(--text3); font-size: 12px; margin-left: 6px; }
.opt .ot b { color: var(--link); font-weight: 650; }
.opt .os { font-size: 12px; color: var(--text3); white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.grp-h { font-size: 11px; font-weight: 600; color: var(--text3); padding: 10px 10px 4px; letter-spacing: .04em; text-transform: uppercase; }
.mru .opt { min-height: 44px; }
.mru .opt .two { flex: 1; min-width: 0; }
.mru .opt .two div:first-child { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

## Goals

- Agent edits arrive through the same CRDT path as human edits, so they are *attributed* and revertible.

## Architecture

One **Durable Object** per note owns its live Yjs state and fans updates out over WebSockets; a WorkspaceDoc holds the folder tree. D1 is only a rebuildable index; snapshots and attachments live in R2.

${F}mermaid

### Merge path

${F}ts
// Apply a remote update and record who made it.
export async function applyRemote(doc: Y.Doc, update: Uint8Array, actor: Actor): Promise<number> {
  const before = Y.encodeStateVector(doc);
  Y.applyUpdate(doc, update, { actor });
  const changed: BlockId[] = diffBlocks(before, doc);
  await history.append({ actor, at: Date.now(), blocks: changed, size: 1024 });
  return changed.length; // 0 when the update was already known
}
${F}

> [!note] Why one Durable Object per note
> Each note syncs and compacts on its own, so a big note never slows the rest, and presence (cursors, agent activity) is scoped to the note you have open.

> [!faq]- What happens if two devices edit the same sentence offline?
> Both edits survive. Yjs interleaves the inserted characters deterministically, and History shows each actor's change so either side can be reverted.

## Sizing

Reconnect cost is roughly linear in pending updates: $T \\approx n \\cdot s / b + r$, where $n$ is the update count, $s$ the mean update size, $b$ bandwidth and $r$ one round trip.

$$
V_{\\text{merged}}[i] = \\max\\left(V_a[i],\\, V_b[i]\\right)
$$

| Scenario | Updates | Payload | Reconnect |
| --- | ---: | ---: | ---: |
| Phone, one day offline | 140 | 38 KB | 0.4 s |
| Laptop, Houston to New York flight | 1,260 | 410 KB | 1.9 s |
| Agent batch edit | 12 | 6 KB | 0.1 s |

// Debounce that keeps the latest arguments.
export function debounce<T extends unknown[]>(fn: (...args: T) => void, ms = 300) {
  let timer: ReturnType<typeof setTimeout> | undefined;
  return (...args: T): void => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}
${F}

${F}ts
type Result<T> = { ok: true; value: T } | { ok: false; error: string };

/* ---- list-style overlays (palette, quick open) ---- */
function listOverlay({ name, placeholder, label, getItems, renderItem, onChoose, footer, cls = '' }) {
  const ov = openOverlay(name, `<div class="dialog ${cls}" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="dlg-search">${icon('search')}<input type="text" role="combobox" aria-expanded="true" aria-controls="${name}-list" aria-autocomplete="list" aria-label="${esc(label)}" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false"></div><div class="dlg-list scroll" id="${name}-list" role="listbox" aria-label="${esc(label)} results"></div><div class="dlg-foot">${footer}</div></div>`);
  const input = $('input', ov), list = $('.dlg-list', ov);
  let items = [], idx = 0;
  const draw = () => {
    items = getItems(input.value);
    idx = clamp(idx, 0, Math.max(0, items.length - 1));
    let html = ''; let lastGroup = null;
    items.forEach((it, i) => {
      if (it.group && it.group !== lastGroup) { html += `<div class="grp-h" role="presentation">${esc(it.group)}</div>`; lastGroup = it.group; }
      html += `<button class="opt" type="button" role="option" id="${name}-o${i}" data-i="${i}" aria-selected="${i === idx}" tabindex="-1">${renderItem(it)}</button>`;
    });
    list.innerHTML = html || `<div class="empty"><p>No matches for “${esc(input.value)}”</p></div>`;
    input.setAttribute('aria-activedescendant', items.length ? `${name}-o${idx}` : '');
    const cur = list.querySelector('[aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  };
  input.addEventListener('input', () => { idx = 0; draw(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = (idx + 1) % Math.max(1, items.length); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = (idx - 1 + items.length) % Math.max(1, items.length); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[idx]) { const it = items[idx]; closeOverlay(true); onChoose(it, input.value); } }
  });
  list.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { const it = items[+b.dataset.i]; closeOverlay(true); onChoose(it, input.value); } });
  list.addEventListener('mousemove', e => { const b = e.target.closest('[data-i]'); if (b && +b.dataset.i !== idx) { idx = +b.dataset.i; $$('[role="option"]', list).forEach(o => o.setAttribute('aria-selected', String(+o.dataset.i === idx))); input.setAttribute('aria-activedescendant', `${name}-o${idx}`); } });
  draw(); input.focus();
  return ov;
}

/* ---- search (⌘⇧F) ---- */
const SEARCH = { q: '', mode: 'hybrid', folder: '', tag: '', date: '', idx: 0 };
const stem = w => w.toLowerCase().replace(/(ies)$/, 'y').replace(/(es|s)$/, '');
function semanticScore(n, terms) {
  if (!terms.length) return 0;
  const concepts = (n.concepts || []).map(c => c.toLowerCase());
  const hits = [];
  let total = 0;
  for (const t of terms) {
    const st = stem(t);
    const expand = new Set([t, st, ...(THESAURUS[t] || []), ...(THESAURUS[st] || [])]);
    let best = 0, n2 = 0;
    for (const c of concepts) {
      if (c === t || stem(c) === st) { best = Math.max(best, 1); hits.push(c); n2++; }
      else if (expand.has(c) || [...expand].some(x => c.includes(x) && x.length > 3)) { best = Math.max(best, 0.78); hits.push(c); n2++; }
    }
    total += Math.min(1, best + 0.04 * Math.max(0, n2 - 1));
  }
  const s = total / terms.length;
  if (!s) return 0;
  const jitter = ((n.id.charCodeAt(6) * 7 + n.id.charCodeAt(8)) % 9) / 100;
  return { score: Math.min(0.97, 0.44 + s * 0.46 + jitter), hits: [...new Set(hits)].slice(0, 3) };
}
function ftMatch(n, terms) {
  const hay = (n.title + ' ' + plainText(n.body)).toLowerCase();
  if (!terms.every(t => hay.includes(t))) return 0;
  let c = 0; terms.forEach(t => { c += hay.split(t).length - 1 + (n.title.toLowerCase().includes(t) ? 3 : 0); });
  return c;
}
function snippetFor(n, terms) {
  const txt = plainText(n.body.split('\n').filter(l => !isNavLine(l)).join('\n'));
  const low = txt.toLowerCase();
  let at = terms.length ? Math.min(...terms.map(t => { const i = low.indexOf(t); return i < 0 ? Infinity : i; })) : 0;
  if (!isFinite(at)) at = 0;
  const start = Math.max(0, at - 60);
  let s = (start > 0 ? '…' : '') + txt.slice(start, start + 190) + (txt.length > start + 190 ? '…' : '');
  s = esc(s);
  for (const t of terms.filter(x => x.length > 1)) s = s.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>');
  return s;
}
function runSearch() {
  const terms = SEARCH.q.toLowerCase().split(/\s+/).filter(Boolean);
  const nowD = now();
  let pool = S.notes.filter(n => (!SEARCH.folder || n.folder === SEARCH.folder || n.folder.startsWith(SEARCH.folder + '/')) && (!SEARCH.tag || noteTags(n).includes(SEARCH.tag)) && (!SEARCH.date || (nowD - n.updated) / 86400000 <= +SEARCH.date));
  if (!terms.length) return pool.sort((a, b) => b.updated - a.updated).slice(0, 8).map(n => ({ n, recent: true }));
  const res = [];
  for (const n of pool) {
    const ft = ftMatch(n, terms);
    const sem = semanticScore(n, terms);
    if (SEARCH.mode === 'fulltext' && ft) res.push({ n, ft, rank: ft });
    else if (SEARCH.mode === 'semantic' && sem) res.push({ n, sem, rank: sem.score });
    else if (SEARCH.mode === 'hybrid' && (ft || sem)) res.push({ n, ft, sem, rank: (ft ? 0.45 + Math.min(ft, 10) / 40 : 0) + (sem ? sem.score * 0.6 : 0) });
  }
  return res.sort((a, b) => b.rank - a.rank).slice(0, 20);
}
function openSearch(prefill) {
  if (typeof prefill === 'string') SEARCH.q = prefill;
  SEARCH.idx = 0;
  const folders = allFolders().filter(f => !f.includes('/') || f.split('/').length === 2);
  const tags = [...new Set(S.notes.flatMap(noteTags))].sort();
  const ov = openOverlay('search', `<div class="dialog search-dlg" role="dialog" aria-modal="true" aria-label="Search notes">
    <div class="dlg-search">${icon('search')}<input id="searchQ" type="search" role="combobox" aria-expanded="true" aria-controls="searchResults" aria-label="Search query" placeholder="Search notes — try “backup strategy” in Semantic" autocomplete="off" spellcheck="false" value="${esc(SEARCH.q)}"></div>
    <div class="search-ctrl"><div class="seg" role="radiogroup" aria-label="Search mode">${[['fulltext', 'Full-text'], ['semantic', 'Semantic'], ['hybrid', 'Hybrid']].map(([v, l]) => `<button type="button" role="radio" data-mode="${v}" aria-checked="${SEARCH.mode === v}">${l}</button>`).join('')}</div><span class="grow"></span>
      <select class="input" id="sFolder" aria-label="Filter by folder"><option value="">All folders</option>${folders.map(f => `<option${SEARCH.folder === f ? ' selected' : ''}>${esc(f)}</option>`).join('')}</select>

      <select class="input" id="sDate" aria-label="Filter by date"><option value="">Any time</option><option value="1"${SEARCH.date === '1' ? ' selected' : ''}>Past day</option><option value="7"${SEARCH.date === '7' ? ' selected' : ''}>Past 7 days</option><option value="30"${SEARCH.date === '30' ? ' selected' : ''}>Past 30 days</option></select></div>

  const q = $('#searchQ', ov);

  $('#sTag', ov).addEventListener('change', e => { SEARCH.tag = e.target.value; drawSearch(); });
  $('#sDate', ov).addEventListener('change', e => { SEARCH.date = e.target.value; drawSearch(); });
  $('#searchResults', ov).addEventListener('click', e => {
    const chip = e.target.closest('[data-q]'); if (chip) { SEARCH.q = chip.dataset.q; if (chip.dataset.mode) SEARCH.mode = chip.dataset.mode; closeOverlay(true); openSearch(); return; }

function drawSearch() {

/* ---- quick capture ---- */
const CAP = { dest: 'today' };
function openCapture() {
  const ov = openOverlay('capture', `<div class="dialog capture" role="dialog" aria-modal="true" aria-labelledby="capH">
    <div class="cap-h"><span class="grow" id="capH">${BRAND_SVG.replace('brand-mark', 'brand-mark" style="width:16px;height:16px')}Quick capture</span><div class="seg" role="radiogroup" aria-label="Destination"><button type="button" role="radio" data-dest="today" aria-checked="${CAP.dest === 'today'}">Today's note</button><button type="button" role="radio" data-dest="inbox" aria-checked="${CAP.dest === 'inbox'}">Inbox</button></div></div>
    <textarea id="capText" aria-label="Capture text" placeholder="What's on your mind?"></textarea>
    <div class="cap-tags">${icon('hash', 'sm')}<input id="capTags" type="text" aria-label="Tags" placeholder="Tags, e.g. idea home-lab"></div>
    <div class="cap-f"><span id="capDest">${CAP.dest === 'today' ? `Appends under Captures in ${ymd(now())}` : 'Creates a new note in Inbox'}</span><span class="grow"></span>${kbd('Mod+Enter')}<button class="btn primary" type="button" data-act="save-capture">Save</button></div></div>`);
  $('.seg', ov).addEventListener('click', e => { const b = e.target.closest('[data-dest]'); if (!b) return; CAP.dest = b.dataset.dest; $$('[data-dest]', ov).forEach(x => x.setAttribute('aria-checked', String(x === b))); $('#capDest').textContent = CAP.dest === 'today' ? `Appends under Captures in ${ymd(now())}` : 'Creates a new note in Inbox'; $('#capText').focus(); });
  $('#capText').focus();
}
function saveCapture() {
  const text = ($('#capText') || {}).value || '';
  const tags = (($('#capTags') || {}).value || '').split(/[\s,]+/).map(t => t.replace(/^#/, '')).filter(Boolean);
  if (!text.trim()) { toast('Nothing to capture yet', { icon: 'capture' }); $('#capText').focus(); return; }
  closeOverlay();
  const line = text.trim().replace(/\s*\n\s*/g, ' ') + (tags.length ? ' ' + tags.map(t => '#' + t).join(' ') : '');
  if (CAP.dest === 'today') {
    flushEditor();
    const { n } = ensureDaily(ymd(now()));
    const entry = `- ${hm(now())} — ${line}`;
    const lines = n.body.split('\n');
    const ci = lines.findIndex(l => /^## Captures/.test(l));
    if (ci < 0) n.body = n.body.replace(/\s+$/, '') + '\n\n## Captures\n\n' + entry;
    else {
      let end = lines.findIndex((l, k) => k > ci && /^#{1,2} /.test(l)); if (end < 0) end = lines.length;
      let at = end; while (at > ci + 1 && !lines[at - 1].trim()) at--;
      lines.splice(at, 0, ...(at === ci + 1 ? ['', entry] : [entry]));
      if (end < lines.length && lines[at + (at === ci + 1 ? 2 : 1)] !== undefined && /^#/.test(lines[at + (at === ci + 1 ? 2 : 1)])) lines.splice(at + (at === ci + 1 ? 2 : 1), 0, '');
      n.body = lines.join('\n');
    }
    touchNote(n); recordVersion(n, n.device, 'Quick capture'); onLocalEdit();
    if (S.openId === n.id) forceEditorRender();
    invalidate();
    toast(`Captured to ${n.title}`, { icon: 'capture', action: { label: 'Open', run: () => openNote(n.id, { selectList: true }) } });
  } else {
    const title = line.length > 48 ? line.slice(0, 46).replace(/\s+\S*$/, '') + '…' : line.replace(/\s#\S+/g, '');
    const c = createNote({ title, folder: 'Inbox', body: line, tags });
    invalidate();
    toast('Captured to Inbox', { icon: 'inbox', action: { label: 'Open', run: () => openNote(c.id, { selectList: true }) } });
  }

    'sep', { label: 'Outline', icon: 'list', run: () => showPanelTab('outline') }, { label: 'Backlinks', icon: 'link', run: () => showPanelTab('backlinks') }, { label: 'History', icon: 'history', run: () => showPanelTab('history') }, { label: 'Info', icon: 'info', run: () => showPanelTab('info') },
    'sep', { label: 'Simulate agent edit', icon: 'terminal', run: () => simulateAgentEdit('claude') }, { label: S.online ? 'Simulate offline' : 'Go back online', icon: 'cloudOff', run: toggleOffline }, { label: 'Settings', icon: 'settings', run: () => openSettings() },
  ], { label: 'More options' });
}
function initPhoneFmt() {
  const bar = $('#phoneFmt');
  const btns = [['bold', 'bold', 'Bold'], ['italic', 'italic', 'Italic'], ['ul', 'list', 'Bulleted list'], ['check', 'checklist', 'Checklist'], ['code', 'code', 'Code'], ['link', 'link', 'Link'], ['image', 'image', 'Image'], ['undo', 'undo', 'Undo']];
  bar.innerHTML = btns.map(([id, ic, l]) => `<button class="icon-btn" type="button" data-pf="${id}" aria-label="${l}">${icon(ic)}</button>`).join('');
  bar.addEventListener('mousedown', e => e.preventDefault());
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-pf]'); if (!b) return;
    const ed = edEl(); if (!ed) return;
    let block = caretBlock();
    if (!block) { ed.focus(); block = ed.lastElementChild; placeCaret(block, true); }
    const sel = getSelection();
    switch (b.dataset.pf) {
      case 'bold': case 'italic': document.execCommand(b.dataset.pf); break;
      case 'ul': case 'check': if (block.tagName === 'P') convertBlock(block, b.dataset.pf, block.textContent.trim()); else insertFromSlash(b.dataset.pf, block); break;
      case 'code': if (!sel.isCollapsed) toggleInlineTag('code'); else insertFromSlash('code', block); break;
      case 'link': if (sel.isCollapsed) toast('Select some text first, then tap Link', { icon: 'link' }); else { applyFormat('link'); const t = ensureFmt(); t.style.display = 'flex'; t.style.left = '8px'; t.style.top = (innerHeight - 120) + 'px'; } break;
      case 'image': insertFromSlash('image', block); break;
      case 'undo': document.execCommand('undo'); break;
    }
    scheduleSave();
  });
  $('#fab').innerHTML = icon('capture');
}

/* List drag & drop (pointer events) --------------------------------------- */
let LDRAG = null, suppressListClickUntil = 0;
function initListDrag() {
  const notes = $('#notes');
  notes.addEventListener('pointerdown', e => {
    const item = e.target.closest('.note-item');
    if (!item || e.button !== 0 || sortMode(S.listKey) !== 'manual' || e.pointerType === 'touch') return;
    LDRAG = { item, id: item.dataset.id, x0: e.clientX, y0: e.clientY, active: false, before: null };
  });
  window.addEventListener('pointermove', e => {
    if (!LDRAG) return;
    if (!LDRAG.active) {
      if (Math.hypot(e.clientX - LDRAG.x0, e.clientY - LDRAG.y0) < 5) return;
      LDRAG.active = true; LDRAG.item.classList.add('dragging');
      const g = document.createElement('div'); g.className = 'drag-ghost'; g.textContent = noteById(LDRAG.id).title; document.body.appendChild(g); LDRAG.ghost = g;
    }
    e.preventDefault();
    LDRAG.ghost.style.left = (e.clientX + 12) + 'px'; LDRAG.ghost.style.top = (e.clientY - 14) + 'px';
    const items = $$('#notes .note-item').filter(x => x !== LDRAG.item);
    let before = null;
    for (const it of items) { const r = it.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = it; break; } }
    LDRAG.before = before;
    const line = $('#dropLine'); const notesEl = $('#notes');
    const last = items[items.length - 1];
    const y = before ? before.offsetTop - 2 : last ? last.offsetTop + last.offsetHeight + 1 : 0;
    line.style.display = 'block'; line.style.top = y + 'px';
    const r = notesEl.getBoundingClientRect();
    if (e.clientY < r.top + 30) notesEl.scrollTop -= 8; else if (e.clientY > r.bottom - 30) notesEl.scrollTop += 8;
  });
  window.addEventListener('pointerup', () => {
    if (!LDRAG) return;
    const d = LDRAG; LDRAG = null;
    if (!d.active) return;
    d.ghost.remove(); $('#dropLine').style.display = 'none'; d.item.classList.remove('dragging');
    suppressListClickUntil = Date.now() + 250;
    const ids = sortedList(S.listKey).map(n => n.id).filter(id => id !== d.id);
    const at = d.before ? ids.indexOf(d.before.dataset.id) : ids.length;
    ids.splice(at, 0, d.id);
    S.manualOrder[S.listKey] = ids;
    renderList();
    toast(`Moved “${noteById(d.id).title}” to position ${at + 1}`, { icon: 'grip' });
  });
}

/* Global click actions ------------------------------------------------------ */
const ACTIONS = {
  open: el => openNote(el.dataset.id, { keepScroll: false }),
  folder: el => { const f = el.dataset.folder; if (S.listKey === 'folder:' + f && !isPhone()) { if (S.expanded.has(f)) S.expanded.delete(f); else S.expanded.add(f); invalidate(); } else { S.expanded.add(f); selectList('folder:' + f); } },
  twisty: el => { const f = el.dataset.folder; if (S.expanded.has(f)) S.expanded.delete(f); else S.expanded.add(f); invalidate(); },
  tag: el => selectList('tag:' + el.dataset.tag),
  'list-recent': () => selectList('recent'),
  search: () => openSearch(), today: () => openToday(), week: () => openThisWeek(), capture: () => openCapture(), graph: () => toggleGraph(), settings: () => openSettings(),
  'settings-keys': () => { closeOverlay(true); openSettings('keys'); }, 'settings-sync': () => { closeOverlay(true); openSettings('sync'); },
  'open-day': el => openDaily(el.dataset.day), 'open-week': el => openWeekly(el.dataset.week),
  'cal-prev': () => { const d = new Date(S.cal.y, S.cal.m - 1, 1); S.cal = { y: d.getFullYear(), m: d.getMonth() }; invalidate(); },
  'cal-next': () => { const d = new Date(S.cal.y, S.cal.m + 1, 1); S.cal = { y: d.getFullYear(), m: d.getMonth() }; invalidate(); },
  'new-folder': () => newFolder(), 'new-note': () => newNote(),
  'toggle-sidebar': () => toggleSidebar(), 'toggle-panel': () => togglePanel(), 'toggle-source': () => toggleSource(),
  history: () => { if (S.panel && S.panelTab === 'history' && !isPhone()) togglePanel(); else showPanelTab('history'); },
  'copy-menu': el => copyMenu(el), 'more-menu': el => moreMenu(el), 'sort-menu': el => sortMenu(el),
  'panel-tab': el => { set({ panelTab: el.dataset.tab }); requestAnimationFrame(() => { const t = $(`#panel [data-tab="${el.dataset.tab}"]`); if (t) t.focus(); }); },
  outline: el => { const ed = edEl(); const h = ed && ed.querySelectorAll(':scope > h1, :scope > h2, :scope > h3')[+el.dataset.idx]; if (h) { h.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); placeCaret(h, true); } if (isPhone()) { S.panelSheet = false; invalidate(); } },
  'outline-top': () => { $('#edScroll').scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); },
  version: el => set({ selVersion: el.dataset.v }), restore: el => restoreVersion(el.dataset.v),
  'dismiss-welcome': () => { S.welcome = false; forceEditorRender(); toast('Tips hidden · bring them back from the command palette', { icon: 'leaf' }); },
  'agent-edit': () => simulateAgentEdit('claude'),
  'prev-period': () => stepPeriod(-1), 'next-period': () => stepPeriod(1),
  'add-tag': el => addTagInline(el), 'close-overlay': () => closeOverlay(), 'close-graph': () => toggleGraph('note'),
  'save-capture': () => saveCapture(), 'toggle-offline': () => { closeOverlay(true); toggleOffline(); if (OVERLAY.name === 'settings') drawSettings(); }, 'push-git': () => pushGit(),
  'sync-pop': el => openMergePopover(el),
  'p-back': () => phoneBack(), 'p-overflow': el => phoneOverflow(el),
};
document.addEventListener('click', e => {
  const pill = e.target.closest('#syncPill'); if (pill) { openMergePopover(pill); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.closest('#notes') && Date.now() < suppressListClickUntil) { e.preventDefault(); return; }
  const act = el.dataset.act;
  if (['copy-code', 'open-embed', 'open-attach'].includes(act)) return;
  if (ACTIONS[act]) { e.preventDefault(); ACTIONS[act](el, e); }
});
$('#fab').addEventListener('click', () => openCapture());

/* 13. Boot ------------------------------------------------------------------- */
function boot() {
  applyTheme();
  initEditorEvents();
  initListDrag();
  initPhoneFmt();
  const pick = t => (resolveLink(t) || {}).id;
  S.mru = ['New Orleans trip — Dec 2026', 'Home Lab — Proxmox upgrade plan', '2026-10-21', 'Penmoss — product brief'].map(pick).filter(Boolean).reverse();
  const first = pick('Penmoss — sync design');
  S.openId = first; pushMru(first);
  renderAll();
  if (window.ResizeObserver) new ResizeObserver(() => { if (S.view === 'graph' && GRAPH.built) fitGraph(); }).observe($('#graph'));
  let lastPhone = isPhone();
  window.addEventListener('resize', debounce(() => {
    const p = isPhone();
    if (p !== lastPhone) { lastPhone = p; S.pscreen = p ? 'home' : S.pscreen; S.pstack = []; S.panelSheet = false; if (S.view === 'graph' && p) S.pscreen = 'graph'; }
    invalidate(); if (S.view === 'graph') fitGraph();
  }, 120));
}
boot();
</script>
