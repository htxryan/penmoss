name: Android SDK
description: >-
  The Android command-line tools (checked against the SHA-256 of Google's archive), platform 37,
  build tools 37.0.0 and any more packages asked for, in this Mac runner's tool cache
  (_work/_tool/android-sdk), for the android and android-emulator jobs (docs/ci.md). Java tools
  also see the tool cache as their home, so Robolectric's downloads (~/.m2) and the debug key
  (~/.android) stay with the runner, out of the account's home folder. Run it after
  .github/actions/setup (PENMOSS_CACHE) and actions/setup-java.
inputs:
  packages:
    description: More sdkmanager packages, separated by spaces (the emulator job's system image)
    default: ''
runs:
  using: composite
  steps:
    - name: Android SDK platform 37 and build tools (Mac, into the runner's tool cache)
      shell: bash
      env:
        TOOLS_ZIP: commandlinetools-mac_arm64-16111833_latest.zip
        TOOLS_SHA256: 58da8f215781cc0208743e88b65ae259780c55e7eb40e50373d377cf369232d6
        PACKAGES: ${{ inputs.packages }}
      run: |
        sdk="$RUNNER_TOOL_CACHE/android-sdk"
        tools="$sdk/cmdline-tools/16111833"
        if [ ! -x "$tools/bin/sdkmanager" ]; then
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$TOOLS_ZIP" "https://dl.google.com/android/repository/$TOOLS_ZIP"
          echo "$TOOLS_SHA256  $RUNNER_TEMP/$TOOLS_ZIP" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/cmdline-tools" "$tools"
          unzip -q "$RUNNER_TEMP/$TOOLS_ZIP" -d "$RUNNER_TEMP"
          mkdir -p "$sdk/cmdline-tools"
          mv "$RUNNER_TEMP/cmdline-tools" "$tools"
        fi
        read -r -a more <<< "$PACKAGES"
        # `yes` ends on SIGPIPE once sdkmanager is done, which pipefail would count as a failure.
        (yes || true) | "$tools/bin/sdkmanager" --sdk_root="$sdk" "platforms;android-37.0" "build-tools;37.0.0" "${more[@]}" > /dev/null
        {
          echo "ANDROID_HOME=$sdk"
          echo "ANDROID_SDK_ROOT=$sdk"
          echo "ANDROID_USER_HOME=$PENMOSS_CACHE/android-user-home"
          echo "JAVA_TOOL_OPTIONS=-Duser.home=$PENMOSS_CACHE/java-home"
        } >> "$GITHUB_ENV"
