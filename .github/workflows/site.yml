# penmoss.app's deploy (T80.12, R8, P9; A1205, A1361). Every push to main that changes the site
# deploys it, so a merged page is live within minutes; publishing a stable release rebuilds it so
# its download cards show that release's version, date and sizes. A dispatch deploys the chosen
# branch, optionally describing a given release (a rehearsal).
name: Site

on:
  # A merged change to the site, or to how it is built and deployed (A1361). The pull request's
  # Site check built and tested it; a site that does not build stops at the build below.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
      - '.github/actions/setup/**'
      - 'pnpm-lock.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: 'A release tag for the download cards to describe (empty: the latest stable release)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy penmoss.app
    # A prerelease (an Alpha build, or a vX.Y.Z-rc.N rehearsal) never moves the site.
    if: github.event_name != 'release' || !github.event.release.prerelease
    # A1235: a hosted runner. The Cloudflare token is an environment secret limited to main and
    # v* tags, and this workflow never runs on a pull request, so no fork's code ever sees it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare token lives in this environment, limited to main and v* tags (docs/ci.md, "Deploying penmoss.app").
    environment: site-deploy
    permissions:
      contents: read
    steps:
      - name: Without the token, warn and stop (never fail a release)
        id: token
        env:
          TOKEN: ${{ secrets.PENMOSS_SITE_CLOUDFLARE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PENMOSS_SITE_CLOUDFLARE_TOKEN is not set in the site-deploy environment: penmoss.app was not deployed (docs/ci.md, Deploying penmoss.app)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        if: steps.token.outputs.ready == 'true'

      - name: Build the site with the release's version (the latest stable one but for a release or a chosen tag)
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PENMOSS_SITE_REPO: ${{ github.repository }}
          PENMOSS_SITE_RELEASE: ${{ inputs.release || github.event.release.tag_name }}
        run: task site:build

      - name: Deploy to Cloudflare (the penmoss-site Worker's static assets)
        if: steps.token.outputs.ready == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PENMOSS_SITE_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6e32c58c0c71b7228ddca35c4c466b6c
        run: pnpm exec wrangler deploy
