name: CI

on:
  # A1181: every pull request runs, so the checks main requires (pick and the four test jobs)
  # always report. For a change that only touches docs, the static site, prototypes or spikes,
  # `pick` turns every job off (A1095): they report as skipped, which counts as passing, and only
  # `pick` runs, in seconds.
  pull_request:
  # A1095: on main, such a change runs no CI at all (no build, no release). Markdown is ignored
  # except the test fixtures, which are inputs to the codec's tests. Later patterns win.
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!site/**'
      - '!prototype/**'
      - '!spikes/**'
      - '!**/*.md'
      - '**/test/**'
      - '!.claude/**'
  # Builds the Mac app on any branch (A403) and publishes nothing. With `ci` it also runs the CI
  # jobs (docs/ci.md §5).
  workflow_dispatch:
    inputs:
      ci:
        description: Also run the CI jobs (docs/ci.md §5)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A pull request's new push cancels its older run. Main's runs never queue behind each other
  # (A403): a run whose Mac jobs wait hours for the Mac must not hold up the next merge's APK.
  # The jobs that change releases share their own group instead.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # D65: the build number is the run number plus this. The public repository's runs started again
  # at 1 on 7 Nov 2026, after about 490 in the private one, and builds must keep counting up: the
  # Mac's update feed and Android's versionCode never go back.
  PENMOSS_RUN_OFFSET: '1000'

# Where each job runs (A1235, docs/ci.md §1). The repository is public, so GitHub's standard
# hosted runners cost nothing: `ubuntu-latest` runs pick and every test job, a fork's pull
# request's included, once a maintainer approves its run (docs/ci.md §9). Ryan's self-hosted
# Macs keep what signs, publishes or is calibrated there: the budgets (A1160), the public APK
# (the sideload key), the dmg (Developer ID, A406) and the release jobs. Each of those starts its
# if: with the fork guard (P10, A1183), so a fork's pull request never reaches a Mac. Every
# runs-on is static, and .github/scripts/runner-policy.mjs (task ci:lint) holds all of this.
jobs:
  pick:
    name: Pick runners (the Mac if one is idle)
    # Which parts a change touches, so the other jobs skip what it can't affect (A1095). It used
    # to pick runners too (A404); now every job names its runner itself (A1218, A1235). The
    # name is what ruleset "main: CI checks" requires (A1181): rename the two together.
    if: github.event_name != 'workflow_dispatch' || inputs.ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      check: ${{ steps.changes.outputs.check }}
      web: ${{ steps.changes.outputs.web }}
      android-app: ${{ steps.changes.outputs.android }}
      desktop: ${{ steps.changes.outputs.desktop }}
      site: ${{ steps.changes.outputs.site }}
    steps:
      - name: Which parts of the repository changed (A1095)
        id: changes
        # Each job runs only when a file it builds or tests changed. The file list comes from
        # GitHub's API (no checkout): the pull request's files, or the push's compare. Anything
        # that can't be listed (a dispatch, a new branch, an API error, a list GitHub truncates)
        # runs everything. Shared files (the lockfile, the Taskfile, root configs, this workflow
        # and its actions) run everything too.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          files="$RUNNER_TEMP/changed-files.txt"
          all=false
          case "$EVENT" in
            pull_request)
              if gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)' > "$files"; then
                # The files API lists at most 3,000.
                [ "$(wc -l < "$files")" -lt 3000 ] || all=true
              else all=true; fi ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then all=true
              elif gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[] | .filename, (.previous_filename // empty)' > "$files"; then
                # A compare lists at most 300 files.
                [ "$(wc -l < "$files")" -lt 300 ] || all=true
              else all=true; fi ;;
            *) all=true ;;
          esac
          check=false web=false android=false desktop=false site=false
          if [ "$all" = true ]; then check=true web=true android=true desktop=true site=true
          else
            while IFS= read -r f; do
              # penmoss.app (T80.15, R13): the Astro site and its docs get the Site job.
              case "$f" in
                site/*) site=true ;;
              esac
              # Docs, the site, prototypes and spikes change no job; markdown neither,
              # except the test fixtures.
              case "$f" in
                docs/* | site/* | prototype/* | spikes/* | .claude/*) continue ;;
                */test/*) ;;
                *.md) continue ;;
              esac
              case "$f" in
                # Shared: everything builds from these.
                .github/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | Taskfile.yml | \
                  tsconfig.base.json | .node-version | .npmrc | eslint.config.js | stylelint.config.js | \
                  .prettierrc* | .prettierignore)
                  check=true web=true android=true desktop=true site=true ;;
                # Packages the web app, the Android editor and the Mac app all bundle.
                packages/core/* | packages/editor/* | packages/git-notebook/* | packages/sync-client/* | packages/ui/*)
                  check=true web=true android=true desktop=true ;;
                # The web app's source is also the Android editor's and the Mac app's.
                apps/web/*) check=true web=true android=true desktop=true ;;
                # The CLI ships inside the Mac app, and so does search by meaning (D59).
                packages/cli/* | packages/embed/*) check=true desktop=true ;;
                apps/desktop/*) check=true desktop=true ;;
                # The Android editor page and the Play script are JavaScript: Check lints and tests them.
                apps/android/editor/* | apps/android/play/*) check=true android=true ;;
                # Kotlin and Gradle: only the Android job.
                apps/android/*) android=true ;;
                # The relay, scripts and anything else: Check alone.
                *) check=true ;;
              esac
            done < "$files"
          fi
          # On main every build's release carries its APK, and the Mac app joins that release
          # (A400, A403), so a build of the Mac app needs the Android job too.
          if [ "$EVENT" = push ] && [ "$desktop" = true ]; then android=true; fi
          {
            echo "check=$check"
            echo "web=$web"
            echo "android=$android"
            echo "desktop=$desktop"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Changed parts (A1095): check=$check web=$web android=$android desktop=$desktop site=$site (all=$all)"
            [ -s "$files" ] && { echo; echo '```'; head -50 "$files"; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY" || true

  check:
    name: Check
    if: needs.pick.outputs.check == 'true'
    # Lint, typecheck and unit tests. The Playwright smoke suite runs in its own job below, in
    # parallel, so neither nears its time limit as the suites grow (A371). About 8 minutes on a
    # hosted runner on 24 Oct 2026 (docs/ci.md §6), more since.
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Lint, typecheck and unit tests
        run: task check

  site:
    name: Site (penmoss.app and its docs)
    if: needs.pick.outputs.site == 'true'
    # T80.15, R13: builds the site (Astro, Starlight, the links validator, the docs' CSP hashes)
    # and runs site/test under wrangler dev with the real _headers, on a free port.
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          playwright-cache: 'true'

      - name: Install Chromium, and its system libraries if the image lacks any
        timeout-minutes: 15
        run: |
          pnpm --filter @penmoss/site exec playwright install chromium
          sh .github/scripts/system-deps.sh @penmoss/site

      - name: Build the site and check it as served
        run: |
          PENMOSS_SITE_PORT="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          export PENMOSS_SITE_PORT
          task site:test

  e2e:
    name: E2E smoke
    if: needs.pick.outputs.web == 'true'
    # A fresh hosted machine each time (A1235), so the default ports are free.
    needs: pick
    runs-on: ubuntu-latest
    # A620: on Ubuntu the suite took 14–16 minutes on 26 Oct 2026 (130–140 tests, then on one
    # worker), and apt fetched Chromium's system packages at 20–40 kB/s that day, so the install
    # took 9–15 minutes and three main runs were cancelled at 20. Each step has its own limit
    # below, so a hang still fails fast.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          playwright-cache: 'true'

      - name: Install Chromium, and its system libraries if the image lacks any
        timeout-minutes: 15
        run: |
          task e2e:install
          sh .github/scripts/system-deps.sh @penmoss/web

      - name: Playwright E2E (smoke)
        # Twice the 16 minutes it took on Ubuntu (A620) leaves room for retries.
        timeout-minutes: 30
        # Frame-rate budgets (@perf) are measured locally: a shared 4-CPU runner's fps says
        # nothing about Ryan's machines, and the budget stays enforced by `task e2e`. The
        # T31 budgets (@budget) run in their own job below. Two workers, not the Mac's four
        # (A1235): with both of the suite's servers on the hosted runner's few cores, four at once
        # timed out pages ("Target page, context or browser has been closed") at random.
        env:
          PENMOSS_E2E_WORKERS: '2'
        run: task e2e -- --grep-invert "@perf|@budget"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  budgets:
    name: Performance budgets
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.pick.outputs.web == 'true'
    # T31 (A260): the plan's budgets as benchmarks, in their own job so the smoke job's
    # timing stays out of them. Search (T22): the offline index under 150 ms on a 5,000-note
    # vault (the server's FTS and D1 budgets went with the server, T59). Typing
    # p95 under 16 ms in a 10,000-word note and a note switch under 150 ms, in Chromium on
    # the production build. Each measures after a warm-up and asserts a median over runs.
    # A1235: on Ryan's Mac, where the budgets are calibrated (A1160, docs/ci.md §6), so a fork's
    # pull request skips it (the fork guard). Binds two ports of its own (A1140), so any Mac runs
    # it.
    needs: pick
    runs-on: [self-hosted, macOS, ARM64, penmoss-mac]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Search budget (T22, the offline index)
        run: pnpm --filter @penmoss/sync-client perf

      - name: Unit-level budgets (A1244)
        run: pnpm -r --workspace-concurrency=1 --if-present budgets

      - name: Install Chromium (Mac, into the runner's tool cache)
        run: task e2e:install

      - name: Pick this job's e2e ports (Mac)
        run: bash .github/scripts/mac-runner.sh pick-ports

      - name: Free the e2e ports (Mac)
        run: bash .github/scripts/mac-runner.sh free-ports

      - name: Typing and note-switch budgets (T31)
        run: task e2e -- --grep @budget

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: budgets-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop servers and empty the checkout (Mac)
        if: always()
        # Guarded: a failed checkout leaves no script, and nothing to clean.
        run: if [ -f .github/scripts/mac-runner.sh ]; then bash .github/scripts/mac-runner.sh clean --ports; fi

  desktop:
    name: Mac app (Electron under xvfb)
    # Its own job, so the web E2E job is not slowed: Electron's Playwright suite (T29, T30) runs
    # the bundled app under xvfb, with xdotool for the global hotkey. Off from A702 (no free Linux
    # runner) until A1235 put it back on a hosted runner. On a Mac the same suite runs only in
    # the Tart VM (`task desktop:test`, W10). Not a required check (A1181) until it has passed
    # steadily for a while.
    needs: pick
    if: needs.pick.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          electron-cache: 'true'

      # meaning.spec.ts's pinned EmbeddingGemma (about 219 MB), downloaded once per pin.
      - name: Cache the embedding model the meaning tests use
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/penmoss-ci/models
          key: models-${{ hashFiles('packages/embed/src/manifest.ts') }}

      # xdotool's packages (the image has no xdotool), so the job needs no apt mirror once
      # they're here (PEN-114). A new image that can't take them goes to apt and keeps its own.
      # ImageOS and ImageVersion are the runner's own variables, not the workflow's `env`, so an
      # expression can't read them: a step passes them on.
      - name: The runner image
        id: image
        run: echo "os=${ImageOS:?}" >> "$GITHUB_OUTPUT" && echo "version=${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Cache the packages of the tools the job installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/penmoss-ci/debs
          key: debs-desktop-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ steps.image.outputs.version }}
          restore-keys: debs-desktop-${{ runner.os }}-${{ steps.image.outputs.os }}-

      # Electron downloads its binary when first run (pnpm runs no install scripts); fetched
      # now, from the cached download, so system-deps.sh can check the libraries it loads and
      # skip apt when the image has them all (A1308, PEN-114).
      - name: Electron's binary
        run: pnpm --filter @penmoss/desktop exec node -e "require('electron')"

      - name: Chromium's system libraries, xvfb and xdotool (presses the global hotkey)
        timeout-minutes: 15
        run: |
          sh .github/scripts/system-deps.sh @penmoss/web Xvfb:xvfb xdotool:xdotool
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox uses;
          # allow them rather than running Electron with --no-sandbox.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Mac app tests
        run: |
          export PENMOSS_TEST_MODELS="$HOME/.cache/penmoss-ci/models"
          task desktop:test

      - name: Upload the Electron Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 7

  android:
    name: Android app (JVM and Robolectric tests, debug APK)
    # T32: the sync engine's and bridge's JVM tests, Room and Compose UI tests on
    # Robolectric (no emulator), the instrumentation tests compiled, and the debug APK, on a
    # hosted runner (A1235). Main's public APK, signed with the sideload key, is built on the
    # Mac by android-sideload, below.
    needs: pick
    if: needs.pick.outputs.android-app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The committed gradle-wrapper.jar must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Gradle's dependencies and wrapper, and Robolectric's Android jars (~/.m2).
      - name: Cache Gradle and Robolectric's downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The command-line tools, platform 37 and build tools, cached (.github/actions/android-sdk).
      - uses: ./.github/actions/android-sdk

      - name: Android tests
        run: task android:test

      # Every run's debug APK (app.penmoss.debug), signed with the runner's own debug key: the
      # run's artifact, never published (P8).
      - name: Debug APK
        run: task android:build

      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penmoss-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload the Android test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            apps/android/engine-bridge/build/reports/tests/
            apps/android/app/build/reports/tests/
          retention-days: 7

      # So the cache is saved without a daemon still writing to it.
      - name: Stop Gradle
        if: always()
        run: if [ -x apps/android/gradlew ]; then apps/android/gradlew -p apps/android --stop; fi

  android-sideload:
    name: Public APK (release-signed with the sideload key, on Ryan's Mac)
    # On main, the public APK (P8, A1187): the release build of app.penmoss, signed with the
    # stable sideload key (A400) and numbered by build, so each published APK installs over the
    # last. A1235: signing stays on the Mac, as the dmg's does (A406), until Ryan moves it; the
    # key reaches no hosted runner. Only once the android job's tests have passed.
    needs: [pick, android]
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.pick.outputs.android-app == 'true'
    runs-on: [self-hosted, macOS, ARM64, penmoss-mac-general]
    timeout-minutes: 30
    permissions:
      contents: read
    # The sideload key and password live in this environment, limited to main (A405).
    environment: android-sideload
    steps:
      - name: Build number (run number + PENMOSS_RUN_OFFSET, D65)
        run: echo "PENMOSS_RUN=$((GITHUB_RUN_NUMBER + PENMOSS_RUN_OFFSET))" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The committed gradle-wrapper.jar must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The Mac has no SDK of its own for CI: the command-line tools, platform 37 and build tools
      # go in this runner's tool cache (.github/actions/android-sdk).
      - uses: ./.github/actions/android-sdk

      # The key exists only in this step's runner temp folder, and is removed at the end.
      - name: The public APK, release-signed with the sideload key
        env:
          KEYSTORE_B64: ${{ secrets.PENMOSS_SIDELOAD_KEYSTORE_B64 }}
          PENMOSS_SIDELOAD_PASSWORD: ${{ secrets.PENMOSS_SIDELOAD_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # P5 (A1188): X.Y.(Z+1)-alpha.<build> from the newest v* tag; the release jobs read it
          # from version.txt beside the APK.
          version="$(node .github/scripts/releases.mjs version --run "$PENMOSS_RUN")"
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          export PENMOSS_SIDELOAD_KEYSTORE="$RUNNER_TEMP/sideload.jks"
          export PENMOSS_VERSION_CODE="$PENMOSS_RUN" PENMOSS_VERSION_NAME="$version"
          task android:apk:sideload
          echo "$version" > apps/android/app/build/outputs/apk/release/version.txt
          rm -f "$RUNNER_TEMP/sideload.jks"
          # Not debuggable, app.penmoss, v2 or later, and the sideload key's certificate.
          bash .github/scripts/apk-check.sh apps/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload the public APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penmoss-android-sideload
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/apk/release/version.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove the sideload key, stop Gradle and empty the checkout (Mac)
        if: always()
        # Guarded: a failed checkout leaves no script, and nothing to clean.
        run: |
          rm -f "$RUNNER_TEMP/sideload.jks"
          if [ -f .github/scripts/mac-runner.sh ]; then bash .github/scripts/mac-runner.sh clean; fi

  android-emulator:
    name: Android app on an emulator (instrumented tests)
    # F9 (A1227): the instrumented tests (apps/android/app/src/androidTest) on a headless API 37
    # emulator, which the android job only compiles. Every instrumented test but NoteListJankTest,
    # a frame-rate measurement for the Pixel (A285). Not a required check (A1181): it is new; it
    # joins the ruleset once it has proved steady. A1235: on a hosted runner with KVM, so the
    # x86_64 image of A1227's API 37 Google APIs image (the factory slots' is arm64-v8a, which an
    # x86_64 machine can't run natively). .github/scripts/android-emulator.sh still uses
    # emulator-5580 and adb's server on 5050.
    needs: pick
    if: needs.pick.outputs.android-app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      # As reactivecircus/android-emulator-runner documents: the runner's user may use /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The committed gradle-wrapper.jar must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # The android job's cache; that job saves it.
      - name: Restore Gradle's downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/libs.versions.toml', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The android job's SDK, with the emulator, adb and the API 37 image. The image (about
      # 1.5 GB) is downloaded on every run and never cached.
      - uses: ./.github/actions/android-sdk
        with:
          packages: platform-tools emulator system-images;android-37.0;google_apis;x86_64

      - name: The CI AVD
        run: bash .github/scripts/android-emulator.sh avd

      # Before the boot: a Gradle build beside a software-rendered emulator stops System UI
      # responding (F0.4).
      - name: Build the debug and test APKs
        run: task android:build -- :app:assembleDebugAndroidTest

      - name: Instrumented tests on emulator-5580
        # 5 minutes at most to boot, then the tests.
        timeout-minutes: 40
        run: bash .github/scripts/android-emulator.sh test

      - name: Upload the instrumented test reports and the emulator's log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-reports
          path: |
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/emulator.log
          retention-days: 7

      - name: Stop the emulator
        if: always()
        # Guarded: a failed checkout leaves no script. `stop` kills only the emulator and adb of
        # the SDK in this runner's tool cache, even when the job was cancelled mid-run.
        run: if [ -f .github/scripts/android-emulator.sh ]; then bash .github/scripts/android-emulator.sh stop; fi

  android-release:
    name: Publish the build's release (APK now, Mac app when the Mac has built it)
    # Every merge to main gets a prerelease, build-<run>, with its public APK (P8, A1187), never
    # Latest (P3, A1188), and its APK replaces Penmoss.apk on the rolling alpha release (P4). It
    # never waits for the Mac: .github/scripts/releases.mjs carries the newest Mac app into it
    # until the Mac adds this build's own, and keeps the last 10 builds.
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android-sideload
    runs-on: [self-hosted, macOS, ARM64, penmoss-mac-general]
    timeout-minutes: 15
    permissions:
      contents: write
      # publish-notes reads which pull requests each commit came from (PEN-106, A1301).
      pull-requests: read
    concurrency:
      group: releases
      cancel-in-progress: false
    steps:
      - name: Build number (run number + PENMOSS_RUN_OFFSET, D65)
        run: echo "PENMOSS_RUN=$((GITHUB_RUN_NUMBER + PENMOSS_RUN_OFFSET))" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: The GitHub CLI is installed for the Mac runners' account
        run: command -v gh > /dev/null || { echo "::error::Install gh for the penmoss-ci account (brew install gh)"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: penmoss-android-sideload
          path: apk

      - name: Create the release, carry the newest Mac app, keep the last 10
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ env.PENMOSS_RUN }}
          SHA: ${{ github.sha }}
        run: |
          node .github/scripts/releases.mjs publish-apk --run "$RUN" --sha "$SHA" --apk apk/app-release.apk
          node .github/scripts/releases.mjs publish-alpha --run "$RUN" --sha "$SHA" \
            --version "$(cat apk/version.txt)" --apk apk/app-release.apk

      - name: Release notes from the pull requests merged since the last build (A1301)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ env.PENMOSS_RUN }}
          SHA: ${{ github.sha }}
        run: node .github/scripts/releases.mjs publish-notes --run "$RUN" --sha "$SHA"

  mac:
    name: Mac app dmg (on Ryan's Mac)
    # A403: every merge to main, and workflow_dispatch on any branch, packages the Mac app on
    # Ryan's Mac, a self-hosted runner, where main's build is signed with the Developer ID (A406).
    # The Mac may be asleep for hours: nothing else waits for this job, and a newer build of the
    # same branch cancels one still waiting or running. The runner is protected by who can push,
    # not by the event: any branch's own workflow file can run code on it (docs/ci.md §7).
    # A1095: on main, only when something the Mac app is built from changed. A dispatch always
    # builds it, with or without the CI jobs (pick is skipped without `ci`).
    needs: pick
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.pick.outputs.desktop == 'true'))
    # A general runner, so the ports runner stays free for the budgets job.
    runs-on: [self-hosted, macOS, ARM64, penmoss-mac-general]
    timeout-minutes: 30
    permissions:
      contents: read
    # Signing secrets would live in this environment, limited to main; other builds get none.
    # It stays empty while signing runs on these self-hosted runners (A405, docs/ci.md §7).
    environment: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'mac-signing' || '' }}
    concurrency:
      group: mac-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Build number (run number + PENMOSS_RUN_OFFSET, D65)
        run: echo "PENMOSS_RUN=$((GITHUB_RUN_NUMBER + PENMOSS_RUN_OFFSET))" >> "$GITHUB_ENV"

      # Checkout cleans first (git clean -ffdx), so nothing from an earlier build can ship.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # P5 (A1188): X.Y.(Z+1)-alpha.<build> counted from the newest v* tag (0.2.0-alpha.<build>
      # before any). About Penmoss shows it, and the alpha feed names it.
      - name: The app version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="$(node .github/scripts/releases.mjs version --run "$PENMOSS_RUN")"
          echo "PENMOSS_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version"

      # A Developer ID certificate only ever comes from these secrets, never from Ryan's
      # keychain. Without one the app is signed ad hoc (electron-builder.config.cjs). They belong
      # in the `mac-signing` environment, which only main's pushes can use (docs/desktop.md §3).
      - name: Signing and notarisation credentials, if the secrets exist
        env:
          HAS_CERTIFICATE: ${{ secrets.PENMOSS_MAC_CSC_LINK != '' }}
          NOTARY_KEY: ${{ secrets.PENMOSS_MAC_APPLE_API_KEY }}
        run: |
          if [ "$HAS_CERTIFICATE" = true ]; then
            echo "Signing with the Developer ID certificate in PENMOSS_MAC_CSC_LINK."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No certificate secret: signing ad hoc."
          fi
          if [ -n "$NOTARY_KEY" ]; then
            umask 077
            printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/penmoss-notary.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/penmoss-notary.p8" >> "$GITHUB_ENV"
          fi

      - name: Package the app (task desktop:build, then electron-builder)
        env:
          CSC_LINK: ${{ secrets.PENMOSS_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.PENMOSS_MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.PENMOSS_MAC_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.PENMOSS_MAC_APPLE_API_ISSUER }}
          PENMOSS_BUILD_NUMBER: ${{ env.PENMOSS_RUN }}
          # P7 (A1186): every Mac build CI makes runs on Apple Silicon and Intel Macs alike.
          PENMOSS_MAC_ARCH: universal
        run: |
          # electron-builder reads an empty CSC_LINK as a path; a missing secret must be unset.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          unset CSC_NAME
          rm -rf apps/desktop/dist apps/desktop/release
          task desktop:package

      # The signature, Gatekeeper's verdict, the owner check, both architectures in every binary
      # (P7, A1186), the update feed and the dmg (.github/scripts/mac-check.sh).
      - name: Check the signature, Gatekeeper's verdict, the architectures and the dmg
        env:
          HAS_CERTIFICATE: ${{ secrets.PENMOSS_MAC_CSC_LINK != '' }}
          RUN: ${{ env.PENMOSS_RUN }}
          VERSION: ${{ env.PENMOSS_APP_VERSION }}
        run: |
          bash .github/scripts/mac-check.sh
          echo "$VERSION" > apps/desktop/release/version.txt

      # T75 (A1152): the app's binary as the CLI finds a note by meaning, with the pinned model
      # kept on the runner between builds, and refuses semantic search without it.
      - name: Search by meaning in the packaged app
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/Penmoss.app)
          bash .github/scripts/meaning-check.sh "${apps[0]}"

      - name: Upload the dmg, and a signed build's update files (A1015, A1188)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: penmoss-mac
          path: |
            apps/desktop/release/penmoss-mac-${{ env.PENMOSS_RUN }}.dmg
            apps/desktop/release/penmoss-mac-${{ env.PENMOSS_RUN }}.zip
            apps/desktop/release/alpha-mac.yml
            apps/desktop/release/version.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove the notarisation key and empty the checkout
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/penmoss-notary.p8"
          if [ -f .github/scripts/mac-runner.sh ]; then bash .github/scripts/mac-runner.sh clean; fi

  mac-release:
    name: Publish the Mac app to the build's release and to alpha
    # A403, A405: the dmg goes on the release of the commit it was built from, and on to newer
    # releases that hold an older Mac app; then onto the rolling alpha release as Penmoss.dmg,
    # with its zip and alpha-mac.yml (P4, A1188). Pushes to main only, and only once the Mac app's
    # tests passed. A dispatch publishes nothing, even on main: its run number is not the
    # build's, so the dmg and the app inside would disagree. To redo a main build's Mac app,
    # re-run that push run's failed or cancelled jobs (docs/desktop.md §3).
    needs: [mac, android-release]
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.mac.result == 'success' && needs.android-release.result == 'success'
    runs-on: [self-hosted, macOS, ARM64, penmoss-mac-general]
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: releases
      cancel-in-progress: false
    steps:
      - name: Build number (run number + PENMOSS_RUN_OFFSET, D65)
        run: echo "PENMOSS_RUN=$((GITHUB_RUN_NUMBER + PENMOSS_RUN_OFFSET))" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: The GitHub CLI is installed for the Mac runners' account
        run: command -v gh > /dev/null || { echo "::error::Install gh for the penmoss-ci account (brew install gh)"; exit 1; }

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: penmoss-mac
          path: dmg

      - name: Attach the Mac app to this commit's release and newer ones, then to alpha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ env.PENMOSS_RUN }}
          SHA: ${{ github.sha }}
        run: |
          args=(--sha "$SHA" --dmg "dmg/penmoss-mac-$RUN.dmg")
          # A signed build's zip and feed go too; on build-<run> the feed keeps its old name,
          # latest-mac.yml (A1015).
          if [ -f dmg/alpha-mac.yml ]; then
            args+=(--zip "dmg/penmoss-mac-$RUN.zip" --feed dmg/alpha-mac.yml)
          fi
          node .github/scripts/releases.mjs publish-mac "${args[@]}"
          # The Alpha channel (P4): Penmoss.dmg, the zip, SHA256SUMS.txt, alpha-mac.yml last.
          if [ -f dmg/alpha-mac.yml ]; then
            node .github/scripts/releases.mjs publish-alpha --run "$RUN" --sha "$SHA" \
              --version "$(cat dmg/version.txt)" --dmg "dmg/penmoss-mac-$RUN.dmg" \
              --zip "dmg/penmoss-mac-$RUN.zip" --feed dmg/alpha-mac.yml
          else
            echo "::warning::An unsigned build has no update feed: alpha keeps its Mac app."
          fi
