name: Release

# P3 (A1189): a stable release, from the tag `task release -- X.Y.Z` pushes. It builds a signed,
# notarised universal dmg on GitHub's hosted Mac and the release-signed APK on a hosted Linux
# runner (A406, A1348), then creates a draft release vX.Y.Z with Penmoss.dmg, Penmoss.apk,
# penmoss-mac-X.Y.Z.zip, SHA256SUMS.txt and latest-mac.yml, and notes generated since the
# previous stable tag. Ryan edits the notes and publishes it, which makes it Latest. A tag with
# an -rc.N suffix makes a draft prerelease, for rehearsals (R5). Pull requests never run this
# workflow, and none of its jobs runs on a self-hosted runner. The builds are ci.yml's own,
# build-mac.yml and build-apk.yml (A1481), with the tag's version and a stable release's checks.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # One run per tag; a second push of the same tag waits rather than racing the first.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  info:
    name: Version, build number and the previous stable tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The number of ci.yml's newest run (below).
      actions: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      previous: ${{ steps.info.outputs.previous }}
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .github/actions/build-number
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # The version is the tag's; the build number (CFBundleVersion, Android's versionCode) is
      # the newest ci.yml run's plus the offset, so a stable APK installs over every alpha APK
      # published so far and the next alpha installs over it (P5, P8). A tag that is not
      # vX.Y.Z or vX.Y.Z-rc.N fails here.
      - name: Read the tag
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/releases.mjs release-info --tag "$TAG" >> "$GITHUB_OUTPUT"
          ci_run="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?per_page=1" --jq '.workflow_runs[0].run_number')"
          echo "ci-run=$ci_run" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: The build number, from ci.yml's newest run (D65)
        id: build
        uses: ./.github/actions/build-number
        with:
          run-number: ${{ steps.info.outputs.ci-run }}

  mac:
    name: Signed, notarised universal dmg
    needs: info
    permissions:
      contents: read
    uses: ./.github/workflows/build-mac.yml
    with:
      build: ${{ needs.info.outputs.build }}
      version: ${{ needs.info.outputs.version }}
      release: true
      # The Developer ID and the notary key (A406). Ryan lets this environment deploy from tags
      # matching v* as well as main (docs/ci.md §10).
      environment: mac-signing
      artifact-name: penmoss-mac-release
    secrets: inherit

  android:
    name: Release-signed APK
    needs: info
    permissions:
      contents: read
    # The sideload key (A400, A405), in the android-sideload environment, which Ryan lets deploy
    # from tags matching v* as well as main (docs/ci.md §10).
    uses: ./.github/workflows/build-apk.yml
    with:
      version-code: ${{ needs.info.outputs.build }}
      version-name: ${{ needs.info.outputs.version }}
      artifact-name: penmoss-android-release
    secrets: inherit

  draft:
    name: Create the draft release
    needs: [info, mac, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: penmoss-mac-release
          path: mac

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: penmoss-android-release
          path: apk

      # Penmoss.dmg, Penmoss.apk, the zip, SHA256SUMS.txt, latest-mac.yml last; it refuses to
      # touch a release that is already published.
      - name: Create the draft (a prerelease for -rc.N)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUILD: ${{ needs.info.outputs.build }}
          VERSION: ${{ needs.info.outputs.version }}
          PREVIOUS: ${{ needs.info.outputs.previous }}
        run: |
          node .github/scripts/releases.mjs draft-stable --tag "$TAG" --build "$BUILD" --previous "$PREVIOUS" \
            --dmg "mac/penmoss-mac-$BUILD.dmg" --zip "mac/penmoss-mac-$VERSION.zip" \
            --feed mac/latest-mac.yml --apk apk/app-release.apk
          echo "Draft ready: https://github.com/$REPO/releases (its text is the Release notes since the previous stable release; edits there stay on GitHub, as the apps read release-notes.json; then Publish release)." >> "$GITHUB_STEP_SUMMARY"
