<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Penmoss Factory</title>
    <script>
      // The theme before first paint, so there's no flash: light unless this browser chose Dark or
      // System (which follows the OS). Without storage it stays light.
      (function () {
        var t = 'light';
        try {
          t = localStorage.getItem('factory-theme') || 'light';
        } catch (e) {
          // Storage off: light.
        }
        if (t !== 'dark' && t !== 'system') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      :root {
        --bg: #f6f5f2;
        --panel: #ffffff;
        --sunk: #efede8;
        --ink: #1c1b19;
        --ink-2: #45433e;
        --muted: #6b6860;
        --line: #e6e3dc;
        --line-2: #d4d0c6;
        --accent: #2448b8;
        --accent-ink: #ffffff;
        --sel: #eaf0fd;
        --live-bg: #e3eefc;
        --live-line: #9dbeeb;
        --live-ink: #0e3466;
        --you-bg: #fff1d9;
        --you-line: #e9b867;
        --you-ink: #5a3700;
        --stop-bg: #fde7e4;
        --stop-line: #e59a90;
        --stop-ink: #7a1b13;
        --card-bg: #f3e9fb;
        --card-line: #c9a6e8;
        --card-ink: #4e2177;
        --idle-bg: #f1f2f4;
        --idle-line: #d9dde3;
        --idle-ink: #3a4350;
        --done-bg: #e5f4eb;
        --done-line: #9cd3b4;
        --done-ink: #174a2e;
        --past: #9cd3b4;
        --todo: #e4e2dc;
        --ok: #2e8b57;
        --bad: #c8372d;
        --warn: #b86e00;
        --code: #f1eee7;
        --log-bg: #f4f2ec;
        --log-ink: #2b2a27;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.06);
        --pop-shadow: 0 8px 28px rgba(16, 24, 40, 0.16);
        /* The step marker and a card's edge, by whose turn it is. */
        --m-live: #2f62c9;
        --m-you: #c98a12;
        --m-stop: #c8372d;
        --m-card: #8a4fc4;
        --m-idle: #8b9099;
        --m-done: #3e9b6a;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #141413;
        --panel: #1d1c1a;
        --sunk: #262522;
        --ink: #ecebe6;
        --ink-2: #cfccc3;
        --muted: #a8a59c;
        --line: #34322e;
        --line-2: #45423d;
        --accent: #8fb0ff;
        --accent-ink: #0d1a3a;
        --sel: #22304f;
        --live-bg: #16283f;
        --live-line: #34598a;
        --live-ink: #cfe0fa;
        --you-bg: #33260f;
        --you-line: #8a6623;
        --you-ink: #f6d9a0;
        --stop-bg: #3a1a17;
        --stop-line: #8a3a32;
        --stop-ink: #ffc3bc;
        --card-bg: #2c1f3a;
        --card-line: #6a4a8c;
        --card-ink: #e3cdfa;
        --idle-bg: #262729;
        --idle-line: #44474c;
        --idle-ink: #cdd2d9;
        --done-bg: #16301f;
        --done-line: #2f6b45;
        --done-ink: #bfe9cf;
        --past: #2f6b45;
        --todo: #3a3834;
        --ok: #6bd49a;
        --bad: #ff8a80;
        --warn: #f2b85b;
        --code: #262522;
        --log-bg: #0f0f0e;
        --log-ink: #e9e3d6;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        --pop-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        --m-live: #6f9bff;
        --m-you: #f2b85b;
        --m-stop: #ff8a80;
        --m-card: #c39bf0;
        --m-idle: #8d939b;
        --m-done: #6bd49a;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-theme='system'] {
          --bg: #141413;
          --panel: #1d1c1a;
          --sunk: #262522;
          --ink: #ecebe6;
          --ink-2: #cfccc3;
          --muted: #a8a59c;
          --line: #34322e;
          --line-2: #45423d;
          --accent: #8fb0ff;
          --accent-ink: #0d1a3a;
          --sel: #22304f;
          --live-bg: #16283f;
          --live-line: #34598a;
          --live-ink: #cfe0fa;
          --you-bg: #33260f;
          --you-line: #8a6623;
          --you-ink: #f6d9a0;
          --stop-bg: #3a1a17;
          --stop-line: #8a3a32;
          --stop-ink: #ffc3bc;
          --card-bg: #2c1f3a;
          --card-line: #6a4a8c;
          --card-ink: #e3cdfa;
          --idle-bg: #262729;
          --idle-line: #44474c;
          --idle-ink: #cdd2d9;
          --done-bg: #16301f;
          --done-line: #2f6b45;
          --done-ink: #bfe9cf;
          --past: #2f6b45;
          --todo: #3a3834;
          --ok: #6bd49a;
          --bad: #ff8a80;
          --warn: #f2b85b;
          --code: #262522;
          --log-bg: #0f0f0e;
          --log-ink: #e9e3d6;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
          --pop-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
          --m-live: #6f9bff;
          --m-you: #f2b85b;
          --m-stop: #ff8a80;
          --m-card: #c39bf0;
          --m-idle: #8d939b;
          --m-done: #6bd49a;
          color-scheme: dark;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        background: var(--bg);
      }
      body {
        margin: 0;
        color: var(--ink);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      a {
        color: var(--accent);
      }
      code,
      pre {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        min-height: 36px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid var(--line-2);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button.secondary {
        border-color: var(--accent);
        color: var(--accent);
      }
      button.quiet {
        border-color: transparent;
        background: none;
        color: var(--muted);
        font-weight: 500;
        padding: 0 8px;
        text-decoration: underline;
        text-underline-offset: 3px;
        text-decoration-color: var(--line-2);
      }
      button.quiet:hover:not(:disabled) {
        color: var(--ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      summary {
        cursor: pointer;
      }
      /* Header: name, the view switch, one health pill, the theme. */
      .top {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 10px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .top .name {
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
      }
      .switch {
        display: flex;
        background: var(--sunk);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
      }
      .switch a {
        font-size: 13px;
        font-weight: 600;
        padding: 4px 12px;
        border-radius: 7px;
        text-decoration: none;
        color: var(--muted);
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .switch a[aria-current='page'] {
        background: var(--panel);
        color: var(--ink);
        box-shadow: var(--shadow);
      }
      .badge {
        font-size: 11.5px;
        font-weight: 700;
        background: var(--bad);
        color: #fff;
        border-radius: 999px;
        padding: 0 6px;
        line-height: 18px;
      }
      :root[data-theme='dark'] .badge {
        color: #1d1c1a;
      }
      .hp {
        position: relative;
      }
      .hp > summary {
        list-style: none;
      }
      .hp > summary::-webkit-details-marker {
        display: none;
      }
      .health {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border-radius: 999px;
        padding: 3px 10px 3px 10px;
        min-height: 30px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid;
        white-space: nowrap;
      }
      .health .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        flex: 0 0 auto;
      }
      .health::after {
        content: '▾';
        opacity: 0.6;
        font-size: 10px;
      }
      .h-running {
        background: var(--done-bg);
        border-color: var(--done-line);
        color: var(--done-ink);
      }
      .h-paused,
      .h-warn {
        background: var(--you-bg);
        border-color: var(--you-line);
        color: var(--you-ink);
      }
      .h-stale,
      .h-dead,
      .h-missing {
        background: var(--stop-bg);
        border-color: var(--stop-line);
        color: var(--stop-ink);
      }
      .pop {
        position: absolute;
        z-index: 5;
        top: calc(100% + 6px);
        left: 0;
        width: max-content;
        max-width: min(460px, calc(100vw - 32px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--pop-shadow);
        padding: 10px 14px;
      }
      .facts {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
        font-size: 13px;
      }
      .facts dt {
        color: var(--muted);
      }
      .facts dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .theme {
        margin-left: auto;
        display: flex;
        background: var(--sunk);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
      }
      .theme button {
        min-height: 28px;
        width: 32px;
        padding: 0;
        border: 0;
        border-radius: 7px;
        background: none;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .theme button[aria-pressed='true'] {
        background: var(--panel);
        color: var(--ink);
        box-shadow: var(--shadow);
      }
      .theme svg {
        width: 16px;
        height: 16px;
      }
      .alert {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--stop-line);
        background: var(--stop-bg);
        color: var(--stop-ink);
      }
      .alert.soft {
        background: var(--you-bg);
        color: var(--you-ink);
        border-color: var(--you-line);
      }
      .alert.info {
        background: var(--idle-bg);
        color: var(--idle-ink);
        border-color: var(--idle-line);
      }
      .cmd {
        display: inline-flex;
        flex-wrap: wrap;
        max-width: 100%;
        align-items: center;
        gap: 8px;
        background: var(--code);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 3px 3px 10px;
        color: var(--ink);
      }
      .cmd code {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .cmd button {
        min-height: 30px;
        padding: 0 10px;
      }
      body.stale #app {
        opacity: 0.55;
      }
      #problem:empty {
        display: none;
      }
      #problem {
        padding: 8px 20px;
        color: var(--bad);
      }
      .pill {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 2px 7px;
        border-radius: 5px;
        white-space: nowrap;
        text-transform: uppercase;
        border: 1px solid;
      }
      .t-live {
        background: var(--live-bg);
        border-color: var(--live-line);
        color: var(--live-ink);
      }
      .t-you {
        background: var(--you-bg);
        border-color: var(--you-line);
        color: var(--you-ink);
      }
      .t-stop {
        background: var(--stop-bg);
        border-color: var(--stop-line);
        color: var(--stop-ink);
      }
      .t-card {
        background: var(--card-bg);
        border-color: var(--card-line);
        color: var(--card-ink);
      }
      .t-idle {
        background: var(--idle-bg);
        border-color: var(--idle-line);
        color: var(--idle-ink);
      }
      .t-done {
        background: var(--done-bg);
        border-color: var(--done-line);
        color: var(--done-ink);
      }
      /* A card's tone as a quiet edge or dot. */
      .e-live {
        --edge: var(--m-live);
      }
      .e-you {
        --edge: var(--m-you);
      }
      .e-stop {
        --edge: var(--m-stop);
      }
      .e-card {
        --edge: var(--m-card);
      }
      .e-idle {
        --edge: var(--m-idle);
      }
      .e-done {
        --edge: var(--m-done);
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--edge, var(--m-idle));
        flex: 0 0 auto;
      }
      .steps {
        display: flex;
        gap: 4px;
      }
      .steps .s {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        min-width: 0;
      }
      .steps .s span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .steps .bar {
        height: 6px;
        border-radius: 3px;
        background: var(--todo);
        border: 0;
      }
      .steps .past .bar {
        background: var(--past);
      }
      .steps .now {
        font-weight: 700;
      }
      .steps.mini .s span:last-child {
        display: none;
      }
      .steps.mini .bar {
        height: 4px;
      }
      .steps .s.now {
        background: none;
        border: 0;
        color: var(--ink);
      }
      .steps .now.t-live .bar {
        background: var(--m-live);
      }
      .steps .now.t-you .bar {
        background: var(--m-you);
      }
      .steps .now.t-stop .bar {
        background: var(--m-stop);
      }
      .steps .now.t-card .bar {
        background: var(--m-card);
      }
      .steps .now.t-idle .bar {
        background: var(--m-idle);
      }
      .steps .now.t-done .bar {
        background: var(--m-done);
      }
      .note {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
      }
      .said:empty {
        display: none;
      }
      .more > summary {
        font-size: 12.5px;
        color: var(--muted);
        padding: 6px 12px;
      }
      .more > p {
        margin: 0 12px 8px;
        font-size: 12.5px;
        color: var(--muted);
      }
      /* Inbox */
      .inbox {
        display: flex;
        align-items: stretch;
        min-height: calc(100vh - 52px);
      }
      .list {
        flex: 0 0 360px;
        min-width: 0;
        border-right: 1px solid var(--line);
        padding: 12px 10px 20px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .list h2 {
        margin: 12px 12px 6px;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        display: flex;
        gap: 6px;
      }
      .list h2:first-child {
        margin-top: 4px;
      }
      .list h2 .n {
        color: var(--ink);
      }
      .item {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 9px 12px 9px 18px;
        border-radius: 10px;
        text-decoration: none;
        color: var(--ink);
      }
      .item::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 11px;
        bottom: 11px;
        width: 3px;
        border-radius: 2px;
        background: var(--edge, var(--line-2));
      }
      .item:hover {
        background: var(--sunk);
      }
      .item[aria-current='true'] {
        background: var(--sel);
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      .item .head {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .key {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin-right: 6px;
      }
      .item .line {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 12.5px;
        color: var(--ink-2);
      }
      .item .brief {
        flex: 1 1 auto;
        min-width: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .item .age {
        flex: 0 0 auto;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .pane {
        flex: 1 1 auto;
        min-width: 0;
        padding: 20px 24px 40px;
      }
      .quiet {
        margin: 4px 12px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .empty {
        padding: 40px 24px;
        color: var(--muted);
      }
      /* Detail: title, meta, links, steps, then Ryan's turn; history below, folded. */
      .detail {
        max-width: 880px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .dhead {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .close {
        font-size: 20px;
        line-height: 1;
        color: var(--muted);
        text-decoration: none;
        min-width: 40px;
        min-height: 40px;
        margin: -8px -10px 0 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
      }
      .close:hover {
        background: var(--sunk);
      }
      .detail h2 {
        margin: 0;
        font-size: 21px;
        line-height: 1.3;
      }
      .detail h2 .key {
        font-size: 15px;
        text-decoration: none;
        vertical-align: 2px;
      }
      .meta {
        margin: -6px 0 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 0;
        font-size: 13px;
        color: var(--muted);
      }
      .meta > * + *::before {
        content: '·';
        margin: 0 8px;
        color: var(--line-2);
      }
      .meta .pill + *::before {
        content: '';
        margin: 0 4px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
      }
      .links a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      .links a::after {
        content: '↗';
        color: var(--muted);
        font-weight: 400;
      }
      .links a.em {
        border-color: var(--accent);
        color: var(--accent);
      }
      .links a:hover {
        background: var(--sunk);
      }
      .todo {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--edge, var(--line-2));
        border-radius: 12px;
        padding: 16px 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: var(--shadow);
      }
      .eyebrow,
      .detail h3 {
        margin: 0;
        font-size: 11.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .ask {
        margin: -6px 0 0;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.3;
      }
      .what {
        margin: -4px 0 0;
        color: var(--ink-2);
      }
      .qs {
        list-style: none;
        margin: 0;
        padding: 0;
        counter-reset: q;
      }
      .q {
        counter-increment: q;
        padding: 14px 0;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: 26px 1fr;
        column-gap: 8px;
        row-gap: 6px;
      }
      .q::before {
        content: counter(q);
        grid-row: 1;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--sunk);
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .q > * {
        grid-column: 2;
      }
      .q .qt {
        grid-row: 1;
        font-weight: 700;
        font-size: 15px;
        line-height: 1.35;
      }
      .q .ctx {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .choices,
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .opt {
        text-align: left;
        white-space: normal;
        font-weight: 500;
        padding: 7px 12px;
        line-height: 1.35;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .opt::before {
        content: '';
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1.5px solid var(--line-2);
        flex: 0 0 auto;
      }
      .opt[aria-pressed='true'] {
        background: var(--sel);
        border-color: var(--accent);
        font-weight: 600;
      }
      .opt[aria-pressed='true']::before {
        border: 4px solid var(--accent);
      }
      .tag {
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--done-bg);
        color: var(--done-ink);
        white-space: nowrap;
      }
      .notes > summary {
        font-size: 13px;
        color: var(--muted);
      }
      .notes ul {
        margin: 6px 0 0;
        padding-left: 20px;
        color: var(--ink-2);
        font-size: 13px;
      }
      .reply {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .qs + .reply,
      .notes + .reply {
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .reply label {
        font-size: 13px;
        font-weight: 600;
      }
      .reply textarea {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--line-2);
        border-radius: 8px;
        resize: vertical;
        min-height: 64px;
        background: var(--panel);
        color: var(--ink);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .actions .others {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        margin-left: auto;
      }
      .actions .count {
        font-size: 12.5px;
        color: var(--muted);
        margin-right: 4px;
      }
      .hist {
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .hist > summary {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .hist[open] > summary {
        margin-bottom: 8px;
      }
      .log {
        margin: 0;
        background: var(--log-bg);
        color: var(--log-ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 11.5px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 220px;
        overflow: auto;
      }
      .runs p {
        margin: 0 0 4px;
        display: flex;
        gap: 10px;
        font-size: 13px;
      }
      .runs .at,
      .out .at {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        color: var(--muted);
        flex: 0 0 auto;
        min-width: 44px;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      /* Activity, on the Pipeline: the slots' runs and what happened, newest first. */
      .today {
        padding: 22px 20px 32px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        border-top: 1px solid var(--line);
      }
      .today h2 {
        margin: 0;
        font-size: 15px;
      }
      .today .row {
        align-items: baseline;
      }
      .tl {
        overflow-x: auto;
      }
      .tl .inner {
        min-width: 720px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lane-row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .lane-row .lname {
        flex: 0 0 52px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .lane {
        position: relative;
        height: 26px;
        flex: 1 1 auto;
        background: var(--sunk);
        border-radius: 6px;
      }
      .ticks {
        position: relative;
        height: 16px;
        flex: 1 1 auto;
        font-size: 11px;
        color: var(--muted);
      }
      .ticks span {
        position: absolute;
      }
      .barx {
        position: absolute;
        top: 3px;
        height: 20px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 600;
        line-height: 18px;
        padding: 0 5px;
        overflow: hidden;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        text-decoration: none;
        border: 1px solid;
      }
      /* A run too short for its key: the chip at its true length, its key beside it (PEN-99). */
      .barx.beside {
        overflow: visible;
        padding: 0;
      }
      .barx.beside .k {
        position: absolute;
        top: 0;
        left: calc(100% + 5px);
      }
      .barx.beside.left .k {
        left: auto;
        right: calc(100% + 5px);
      }
      .out {
        display: flex;
        flex-direction: column;
        max-width: 980px;
      }
      .out p {
        margin: 0;
        display: grid;
        grid-template-columns: 96px 64px minmax(0, 1fr);
        gap: 2px 12px;
        align-items: baseline;
        font-size: 13px;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .out p:last-child {
        border-bottom: 0;
      }
      .out .ev {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 8px;
        align-items: baseline;
      }
      .out .ev strong {
        white-space: nowrap;
      }
      .out .ev .x {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted);
        background: var(--sunk);
        border-radius: 4px;
        padding: 0 5px;
      }
      .out .ev .d {
        color: var(--muted);
      }
      /* Pipeline */
      .pipe {
        display: flex;
        align-items: flex-start;
      }
      .board {
        flex: 1 1 auto;
        min-width: 0;
        overflow-x: auto;
      }
      .legend {
        margin: 0;
        padding: 10px 14px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        border-bottom: 1px solid var(--line);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(260px, 3fr) repeat(9, minmax(64px, 1fr));
        min-width: 860px;
      }
      .hd {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 8px 8px;
        border-left: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .hd:first-child {
        border-left: 0;
        padding-left: 14px;
      }
      .grp {
        grid-column: 1 / -1;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--muted);
        padding: 12px 14px 5px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .prow {
        display: contents;
        color: var(--ink);
        text-decoration: none;
      }
      .prow > div {
        border-bottom: 1px solid var(--line);
        min-height: 46px;
        background: var(--panel);
      }
      .prow:hover > div {
        background: var(--sunk);
      }
      .prow[aria-current='true'] > div {
        background: var(--sel);
      }
      .lbl {
        padding: 6px 14px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        justify-content: center;
        min-width: 0;
      }
      .lbl .k {
        font-size: 13.5px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lbl .sub {
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lbl .phone {
        display: none;
      }
      .cell {
        border-left: 1px solid var(--line);
        padding: 5px 5px;
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .cell .past {
        height: 2px;
        width: 100%;
        background: var(--past);
        opacity: 0.7;
        border-radius: 1px;
      }
      .mark {
        width: 100%;
        min-width: 0;
        border-radius: 6px;
        padding: 3px 6px;
        font-size: 11px;
        line-height: 1.3;
        border: 1px solid;
        overflow-wrap: break-word;
        hyphens: auto;
      }
      .mark b {
        display: block;
      }
      /* The detail has the whole story: a marker shows its first lines. */
      .mark span {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .side {
        flex: 0 0 460px;
        min-width: 0;
        border-left: 1px solid var(--line);
        background: var(--bg);
        padding: 18px 20px 28px;
        box-shadow: -8px 0 24px rgba(16, 24, 40, 0.06);
      }
      .board > .more {
        padding: 6px 2px;
      }
      @media (max-width: 760px) {
        .top {
          padding: 8px 16px;
          gap: 8px 10px;
        }
        .inbox {
          display: block;
          min-height: 0;
        }
        .list {
          border-right: 0;
          padding: 8px 6px 16px;
        }
        .inbox.has-sel .list {
          display: none;
        }
        .inbox:not(.has-sel) .pane {
          display: none;
        }
        .pane {
          padding: 14px 16px 28px;
        }
        .todo {
          padding: 14px 14px 16px;
        }
        .steps .s {
          font-size: 10px;
        }
        .detail h2 {
          font-size: 19px;
        }
        .out p {
          grid-template-columns: 104px minmax(0, 1fr);
        }
        .out p .ev {
          grid-column: 1 / -1;
        }
        .grid {
          display: block;
          min-width: 0;
        }
        .hd,
        .cell {
          display: none;
        }
        .prow {
          display: block;
        }
        .prow > div {
          min-height: 0;
        }
        .lbl {
          padding: 10px 16px;
        }
        .lbl .k,
        .lbl .sub {
          white-space: normal;
        }
        .lbl .phone {
          display: flex;
          flex-direction: column;
          gap: 4px;
          margin-top: 6px;
          font-size: 12.5px;
          color: var(--ink-2);
        }
        .pipe {
          display: block;
        }
        .pipe.has-sel .board {
          display: none;
        }
        .side {
          border-left: 0;
          box-shadow: none;
          padding: 14px 16px 28px;
        }
        .today {
          padding: 18px 16px 28px;
        }
      }
    </style>
  </head>
  <body>
    <div id="top"></div>
    <div id="problem" role="alert"></div>
    <main id="app"></main>
    <script>
      const SAFE = /^(https:\/\/|claude:\/\/)/;
      const NARROW = window.matchMedia('(max-width: 760px)');
      let view = null;
      const drafts = new Map();
      const notes = new Map();
      // Replies sent from this page, by card: shown in place of the questions they answered until
      // the board catches up (it refreshes each poll), so a sent form never looks like a reset.
      const sent = new Map();
      // Answers picked on a plan's questions, per card: question → option. Kept across redraws.
      const picks = new Map();
      // Which folded sections Ryan opened, so a redraw every few seconds keeps them open.
      const opened = new Set();

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined && text !== null) e.textContent = text;
        return e;
      }
      function ago(iso) {
        if (!iso) return '';
        const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
        if (s < 60) return `${Math.floor(s)} s`;
        if (s < 3600) return `${Math.floor(s / 60)} min`;
        if (s < 86400) return `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`;
        return `${Math.floor(s / 86400)} d`;
      }
      function hhmm(iso) {
        return new Date(iso).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23',
        });
      }
      function since(iso, prefix = '') {
        const s = el('span', 'since', iso ? prefix + ago(iso) : '');
        if (iso) {
          s.dataset.since = iso;
          s.dataset.prefix = prefix;
        }
        return s;
      }
      function link(l) {
        if (!SAFE.test(l.href)) return null;
        const a = el('a', '', l.label);
        a.href = l.href;
        if (l.href.startsWith('https:')) {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        }
        return a;
      }
      function copyBox(text) {
        const box = el('span', 'cmd');
        box.append(el('code', '', text));
        const b = el('button', '', 'Copy');
        b.type = 'button';
        b.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
            b.textContent = 'Copied';
          } catch {
            b.textContent = 'Select and copy';
          }
        });
        box.append(b);
        return box;
      }
      // A folded section that stays open across redraws once Ryan opens it.
      function disclosure(key, cls, summary) {
        const d = el('details', cls);
        const s = el('summary');
        s.append(...[].concat(summary));
        d.append(s);
        d.open = opened.has(key);
        d.addEventListener('toggle', () => (d.open ? opened.add(key) : opened.delete(key)));
        return d;
      }

      // Theme: Light by default whatever the OS says; Dark; or System, which follows the OS.
      const THEMES = [
        [
          'light',
          'Light',
          '<circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/>',
        ],
        ['dark', 'Dark', '<path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/>'],
        [
          'system',
          'System',
          '<circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/>',
        ],
      ];
      function theme() {
        const t = document.documentElement.getAttribute('data-theme');
        return t === 'dark' || t === 'system' ? t : 'light';
      }
      function setTheme(t) {
        document.documentElement.setAttribute('data-theme', t);
        try {
          localStorage.setItem('factory-theme', t);
        } catch {
          // Storage off: this page keeps it until it's reloaded.
        }
        for (const b of document.querySelectorAll('.theme button'))
          b.setAttribute('aria-pressed', String(b.dataset.theme === t));
      }
      function themes() {
        const g = el('div', 'theme');
        g.setAttribute('role', 'group');
        g.setAttribute('aria-label', 'Theme');
        for (const [t, name, path] of THEMES) {
          const b = el('button');
          b.type = 'button';
          b.dataset.theme = t;
          b.title = name;
          b.setAttribute('aria-label', name);
          b.setAttribute('aria-pressed', String(theme() === t));
          // A fixed icon of the page's own, not data.
          b.innerHTML = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">${path}</svg>`;
          b.addEventListener('click', () => setTheme(t));
          g.append(b);
        }
        return g;
      }

      // Routing: #inbox, #pipeline, #inbox/issue-75; a notification's #issue-75 opens the card.
      function route() {
        const h = location.hash.replace(/^#/, '');
        const m = /^(?:(inbox|pipeline)\/?)?(?:issue-(\d+))?$/.exec(h) || [];
        let mode = m[1];
        if (!mode) {
          try {
            mode = localStorage.getItem('factory-view') || 'inbox';
          } catch {
            mode = 'inbox';
          }
        }
        if (mode !== 'pipeline') mode = 'inbox';
        return { mode, issue: m[2] ? Number(m[2]) : null };
      }
      const href = (mode, issue) => `#${mode}${issue ? `/issue-${issue}` : ''}`;

      async function act(body, box, onSent) {
        const note = box.querySelector('.said');
        for (const b of box.querySelectorAll('button, textarea')) b.disabled = true;
        note.textContent = 'Sending…';
        try {
          const r = await fetch('/action', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          });
          const j = await r.json().catch(() => ({}));
          const said = r.ok ? j.done : `Failed: ${j.error || r.status}`;
          notes.set(body.issue, said);
          note.textContent = said;
          if (r.ok && onSent) {
            onSent(said);
            drafts.delete(body.issue);
            picks.delete(body.issue);
            render();
            return;
          }
          if (r.ok && body.kind === 'reply') {
            drafts.delete(body.issue);
            picks.delete(body.issue);
            for (const o of (box.closest('.todo') || box).querySelectorAll('.opt'))
              o.setAttribute('aria-pressed', 'false');
            const t = box.querySelector('textarea');
            if (t) t.value = '';
          }
        } catch (e) {
          note.textContent = `Failed: ${e}`;
        } finally {
          for (const b of box.querySelectorAll('button, textarea')) b.disabled = !view.writable;
        }
      }
      function button(label, cls, onClick) {
        const b = el('button', cls, label);
        b.type = 'button';
        if (!view.writable) {
          b.disabled = true;
          b.title = view.readOnly || 'Read-only';
        }
        b.addEventListener('click', onClick);
        return b;
      }

      // Shared pieces: the step marker, the meta line, the detail.
      function steps(c, mini) {
        const row = el('div', mini ? 'steps mini' : 'steps');
        row.setAttribute('role', 'img');
        row.setAttribute('aria-label', `Step: ${view.stages[c.stage]}, ${c.step}`);
        view.stages.forEach((name, i) => {
          const s = el('div', i < c.stage ? 's past' : i === c.stage ? `s now t-${c.tone}` : 's');
          s.append(el('span', 'bar'), el('span', '', name));
          row.append(s);
        });
        return row;
      }
      // The card's facts in muted words: status, agent and model, size, slot, round.
      function facts(c) {
        const out = [c.status];
        if (c.agent) out.push(`${c.agent} / ${c.model}`);
        if (c.priority) out.push(['', 'Urgent', 'High', 'Medium', 'Low'][c.priority]);
        if (c.slot) out.push(`slot ${c.slot}`);
        if (c.round) out.push(c.round);
        return out.filter(Boolean);
      }
      function pill(c) {
        return el(
          'span',
          `pill t-${c.tone}`,
          c.need ? c.need.label : c.paused ? 'Paused' : c.group === 'done' ? 'Done' : c.status,
        );
      }
      function linkLabel(c, l) {
        if (l.label !== c.key) return l.label;
        return /linear\.app/.test(l.href) ? `${c.key} in Linear` : `${c.key} on GitHub`;
      }

      // The plan's questions: each its own block, its context once, its options as toggles.
      function questions(c, box) {
        const chosen = picks.get(c.number) || new Map();
        const ol = el('ol', 'qs');
        for (const p of c.points) {
          const li = el('li', 'q');
          li.append(el('div', 'qt', p.text));
          if (p.context) li.append(el('p', 'ctx', p.context));
          if (p.options.length) {
            const choices = el('div', 'choices');
            choices.setAttribute('role', 'group');
            choices.setAttribute('aria-label', p.text);
            for (const o of p.options) {
              const b = button('', 'opt', () => {
                const now = picks.get(c.number) || new Map();
                if (now.get(p.text) === o.value) now.delete(p.text);
                else now.set(p.text, o.value);
                picks.set(c.number, now);
                for (const x of choices.querySelectorAll('.opt'))
                  x.setAttribute('aria-pressed', String(now.get(p.text) === x.dataset.value));
                counted(c, box);
              });
              b.dataset.value = o.value;
              b.setAttribute('aria-pressed', String(chosen.get(p.text) === o.value));
              b.append(el('span', '', o.label));
              if (o.proposed) b.append(el('span', 'tag', 'proposed'));
              choices.append(b);
            }
            li.append(choices);
          } else li.append(el('p', 'ctx', 'Answer it in your reply below.'));
          ol.append(li);
        }
        return ol;
      }
      function counted(c, box) {
        const n = box.querySelector('.count');
        if (!n) return;
        const asked = c.points.filter((p) => p.options.length).length;
        n.textContent = `${(picks.get(c.number) || new Map()).size} of ${asked} picked`;
      }

      // What this page sent for the card, while the board still shows what it answered. A new
      // question (a different ask time), a finished card, or 15 minutes with nothing asked ends it.
      function sentFor(c) {
        const was = sent.get(c.number);
        if (!was) return null;
        const stale = !c.need && Date.now() - Date.parse(was.at) > 15 * 60000;
        if (c.group === 'done' || (c.need && c.since !== was.since) || stale) {
          sent.delete(c.number);
          return null;
        }
        return was;
      }
      function sentNote(c, was) {
        const box = el('section', 'todo e-live sent');
        box.setAttribute('role', 'status');
        box.append(el('h3', 'eyebrow', 'Sent'));
        box.append(
          el(
            'p',
            'ask',

          el(
            'p',
            'what',

      }
      function detail(c, mode) {
        const box = el('article', 'detail');

        const head = el('div', 'dhead');
        const h = el('h2');
        const k = el('a', 'key', c.key);
        k.href = SAFE.test(c.url) ? c.url : '#';

        const meta = el('p', 'meta');

        else {

          todo.append(el('p', 'ask', c.need ? c.need.brief : c.step));

          if (c.need?.command) todo.append(copyBox(c.need.command));
          if (c.chat) {

          const actions = el('section', 'reply');
          if (c.points.length) todo.append(questions(c, actions));
          if (c.notes.length) {
            const d = disclosure(
              `notes-${c.number}`,

            const ul = el('ul');

            d.append(ul);
            todo.append(d);
          }
          if (c.group !== 'done') {
            const id = `reply-${c.number}`;
            const label = el(
              'label',
              '',
              c.points.length
                ? `Anything else? Posted with your answers on ${c.key}, as you`
                : `Reply on ${c.key}, posted as you`,
            );
            label.htmlFor = id;
            const text = el('textarea');
            text.id = id;
            text.rows = 3;
            text.value = drafts.get(c.number) || '';
            text.disabled = !view.writable;
            text.addEventListener('input', () => drafts.set(c.number, text.value));
            // The picked answers, each as the planner reads one (`On "<text>": <option>`), then
            // whatever Ryan wrote.
            const words = () => {
              const chosen = picks.get(c.number) || new Map();
              const lines = c.points
                .filter((p) => chosen.has(p.text))
                .map((p) => `On "${p.text}": ${chosen.get(p.text)}`);
              return [lines.join('\n'), text.value.trim() ? text.value : '']
                .filter(Boolean)

            const send = (unblock) => {
              const body = words();

            const retry = c.group === 'queue' || c.stage <= 1 ? 'Unblock' : 'Retry';
            const complete = () =>

            // One primary for what the card needs; the rest are quieter.

              row.append(
                button(

                    ? c.points.length
                      ? 'Send answers and continue'
                      : 'Post and continue'

              if (c.canComplete) row.append(complete());
              if (c.blocked)

            } else if (c.blocked) {

              if (c.canComplete) row.append(complete());
              others.append(
                button(retry, 'quiet', () =>

          d.append(el('pre', 'log', c.log.join('\n')));

          if (c.runFolder) {

            r.append(el('span', 'note', 'Run folder'), copyBox(c.runFolder));

          box.append(d);

        return box;
      }

      function inbox(v, sel) {

      // Consecutive lines for one card fold by what happened: "Blocked ×4, 08:12–10:08".
      function grouped(outcomes) {
        const rows = [];
        let run = [];
        const flush = () => {
          const byWhat = new Map();
          for (const o of run) {
            const k = `${o.what}|${o.detail.replace(/\d+/g, '#')}`;
            const g = byWhat.get(k);
            if (g) {
              g.n += 1;
              g.first = o.at;
            } else {
              const row = { ...o, n: 1, first: o.at };
              byWhat.set(k, row);
              rows.push(row);
            }
          }
          run = [];
        };
        for (const o of outcomes) {
          if (run.length && run[0].issue !== o.issue) flush();
          run.push(o);
        }
        flush();
        return rows;
      }
      // The timeline's runs are placed in pixels, so after the lanes are laid out, and again when
      // they change width (PEN-99). Every run shows its full key: inside its chip when the chip
      // holds it, else beside the chip drawn at its true length (6px at least), on its left at
      // the lane's right edge. A run whose chip or key would overlap an earlier one on its slot,
      // or come within 4px of a key outside a chip, takes a further row, and the lane grows to
      // hold its rows.
      const MIN_RUN = 6;
      const GAP = 4;
      const ROW = 24;
      const placing = new ResizeObserver((entries) => {
        for (const { target } of entries) {
          // A re-render drops the old timeline; its last resize (to nothing) lets it go.
          if (!target.isConnected) {
            placing.unobserve(target);
            continue;
          }
          placeRuns(target.closest('.tl'));
        }
      });
      function placeRuns(tl) {
        if (!tl?.isConnected) return;
        const from = Number(tl.dataset.from);
        const span = Number(tl.dataset.to) - from;
        for (const lane of tl.querySelectorAll('.lane')) {
          const width = lane.clientWidth;
          if (!width) continue;
          const runs = [...lane.querySelectorAll('a.barx')];
          // Measure every key first, unconstrained, then place: one layout, not one per run.
          for (const a of runs) a.classList.add('beside');
          const keyWidths = runs.map((a) => a.querySelector('.k').getBoundingClientRect().width);
          const rows = [];
          runs.forEach((a, i) => {
            const start = Number(a.dataset.start);
            const w = Math.min(
              width,
              Math.max(MIN_RUN, ((Number(a.dataset.end) - start) / span) * width),
            );
            const x = Math.min(((start - from) / span) * width, width - w);
            const kw = keyWidths[i];
            // Padding and border take 12px of a chip with its key inside.
            const inside = kw <= w - 12;
            const left = !inside && x + w + GAP + kw > width;
            a.classList.toggle('beside', !inside);
            a.classList.toggle('left', left);
            // What the run takes, with 4px kept clear beyond a key outside its chip.
            const lo = left ? x - 2 * GAP - kw : x;
            const hi = inside || left ? x + w : x + w + 2 * GAP + kw;
            let row = rows.findIndex((taken) => taken.every(([a0, a1]) => lo >= a1 || hi <= a0));
            if (row < 0) row = rows.push([]) - 1;
            rows[row].push([lo, hi]);
            a.style.left = `${x.toFixed(1)}px`;
            a.style.width = `${w.toFixed(1)}px`;
            a.style.top = `${3 + row * ROW}px`;
          });
          lane.style.height = `${26 + Math.max(0, rows.length - 1) * ROW}px`;
        }
      }
      function today(v) {
        const sec = el('section', 'today');
        sec.setAttribute('aria-label', 'Activity');
        const head = el('div', 'row');
        head.append(el('h2', '', 'Activity, last 12 hours'));
        const t = v.totals;
        head.append(
          el(
            'span',
            'note',
            `${t.started} started · ${t.inReview} reached review${t.merged ? ` · ${t.merged} merged` : ''} · ${t.blocked} stopped`,
          ),
        );
        sec.append(head);
        const from = Date.parse(v.timeline.from);
        const to = Date.parse(v.timeline.to);
        const pct = (iso) => `${(((Date.parse(iso) - from) / (to - from)) * 100).toFixed(2)}%`;
        const tl = el('div', 'tl');
        const inner = el('div', 'inner');
        const ticksRow = el('div', 'lane-row');
        const ticks = el('div', 'ticks');
        const first = new Date(from);
        first.setMinutes(0, 0, 0);
        for (let h = first.getTime() + 3600000; h < to; h += 3600000 * 2) {
          const s = el('span', '', hhmm(new Date(h).toISOString()));
          s.style.left = pct(new Date(h).toISOString());
          ticks.append(s);
        }
        ticksRow.append(el('span', 'lname'), ticks);
        inner.append(ticksRow);
        for (const lane of v.timeline.lanes) {
          const row = el('div', 'lane-row');
          const l = el('div', 'lane');
          for (const b of lane.bars) {
            const a = el('a', `barx t-${b.tone}`);
            a.append(el('span', 'k', b.key));
            a.href = href('pipeline', b.issue);
            // Placed by placeRuns once the lane has a width.
            a.dataset.start = String(Math.max(from, Date.parse(b.start)));
            a.dataset.end = String(Date.parse(b.end));
            a.title = `${b.key} ${hhmm(b.start)}–${hhmm(b.end)}: ${b.label}`;
            a.setAttribute('aria-label', a.title);
            l.append(a);
          }
          row.append(el('span', 'lname', `Slot ${lane.slot}`), l);
          inner.append(row);
        }
        tl.dataset.from = String(from);
        tl.dataset.to = String(to);
        // The tick row is as wide as the lanes, and its height never changes as they grow.
        placing.observe(ticks);
        tl.append(inner);
        sec.append(tl);
        const out = el('div', 'out');
        for (const o of grouped(v.outcomes)) {
          const p = el('p');
          const when = o.n > 1 ? `${hhmm(o.first)}–${hhmm(o.at)}` : hhmm(o.at);
          const k = el('a', '', o.key);
          k.href = href('pipeline', o.issue);
          const ev = el('span', 'ev');
          ev.append(el('strong', '', o.what));
          if (o.n > 1) ev.append(el('span', 'x', `×${o.n}`));
          if (o.detail) ev.append(el('span', 'd', o.detail));
          p.append(el('span', 'at', when), k, ev);
          out.append(p);
        }
        if (!v.outcomes.length) out.append(el('p', 'note', 'Nothing yet.'));
        sec.append(out);
        return sec;
      }

      function legend() {
        const p = el('p', 'legend');
        for (const [tone, name] of [
          ['live', 'Factory working'],
          ['you', 'Your turn'],
          ['stop', 'Stopped'],
          ['card', 'Won’t start'],

      }
      function pipeline(v, sel) {
        const wrap = el('div', sel || route().issue !== null ? 'pipe has-sel' : 'pipe');
        const board = el('section', 'board');
        const grid = el('div', 'grid');
        // Each row is a link to the card's detail; the step columns are drawn, not a data table.
        board.setAttribute('aria-label', 'Pipeline');
        board.append(legend());
        const counts = v.stages.map((_, i) => v.cards.filter((c) => c.stage === i).length);
        grid.append(el('div', 'hd', 'Card'));
        v.stages.forEach((s, i) =>
          grid.append(el('div', 'hd', counts[i] ? `${s} ${counts[i]}` : s)),
        );
        const groups = [
          ['needs', 'Needs you'],
          ['working', 'Working'],
          ['queue', 'Queue'],
          ['done', 'Done recently'],
        ];
        for (const [g, name] of groups) {
          const cards = v.cards.filter((c) => c.group === g);
          if (!cards.length) continue;
          grid.append(el('div', 'grp', `${name} · ${cards.length}`));
          for (const c of cards) {
            const row = el('a', 'prow');
            row.href = href('pipeline', c.number);
            if (sel?.number === c.number) row.setAttribute('aria-current', 'true');
            const lbl = el('div', 'lbl');
            const k = el('span', 'k');
            k.append(el('span', 'key', c.key), document.createTextNode(c.title));
            k.title = `${c.key} ${c.title}`;
            const sub = [...facts(c)];
            if (c.pr) sub.push(`PR #${c.pr.split('/').at(-1)}`);
            lbl.append(k, el('span', 'sub', sub.join(' · ')));
            const phone = el('div', 'phone');
            phone.append(steps(c, true), el('span', '', c.need ? c.need.brief : c.step));
            lbl.append(phone);
            row.append(lbl);
            v.stages.forEach((_, i) => {
              const cell = el('div', 'cell');
              if (i < c.stage) cell.append(el('span', 'past'));
              else if (i === c.stage) {
                const m = el('div', `mark t-${c.tone}`);
                m.title = c.need ? `${c.need.brief}. ${c.need.what}` : c.step;
                m.append(
                  el('b', '', c.need ? c.need.label : c.paused ? 'Paused' : ''),
                  el('span', '', c.step),
                );
                if (!m.firstChild.textContent) m.firstChild.remove();
                cell.append(m);
              }
              row.append(cell);
            });
            grid.append(row);
          }
        }
        if (!v.cards.length) grid.append(el('div', 'grp', 'No cards'));
        board.append(grid);
        if (v.outside.length) board.append(outside(v, 'outside-pipeline'));
        wrap.append(board);
        if (sel || route().issue !== null) {
          const side = el('aside', 'side');
          side.setAttribute('aria-label', 'Card detail');
          side.append(sel ? detail(sel, 'pipeline') : missing(v, 'pipeline'));
          wrap.append(side);
        }
        return [wrap, today(v)];
      }

      function render() {
        const v = view;
        if (!v) return;
        // Keep a reply being typed: skip a redraw while a text box has focus.
        if (document.activeElement?.tagName === 'TEXTAREA') {
          pendingRender = true;
          return;
        }
        const r = route();
        try {
          localStorage.setItem('factory-view', r.mode);
        } catch {
          // Storage off: the view just isn't remembered.
        }
        let issue = r.issue;
        if (issue === null && r.mode === 'inbox' && !NARROW.matches)
          issue = v.needs[0]?.number ?? null;
        const sel = v.cards.find((c) => c.number === issue) || null;
        document.body.classList.toggle('stale', !v.health.fresh);
        document.title = v.needs.length ? `(${v.needs.length}) Penmoss Factory` : 'Penmoss Factory';
        // A new view every few seconds redraws the page: keep where Ryan had scrolled the page and
        // each box in it, and jump to a card only when the address names a new one.
        const kept = scrolls();
        document.getElementById('top').replaceChildren(...header(v, r.mode));
        const app = document.getElementById('app');
        app.replaceChildren(...(r.mode === 'pipeline' ? pipeline(v, sel) : inbox(v, sel)));
        // Grow the lanes before the scrolls come back, or a page scrolled to its end jumps.
        placeRuns(app.querySelector('.tl'));
        restoreScrolls(kept);
        if (r.issue !== null && NARROW.matches && scrolledTo !== r.issue)
          document.getElementById(`issue-${r.issue}`)?.scrollIntoView();
        scrolledTo = r.issue;
      }
      let scrolledTo = null;
      // Where an element sits under #app, as child indexes: the redraw builds the same shape.
      function placeOf(el) {
        const path = [];
        for (let n = el; n && n.id !== 'app'; n = n.parentElement)
          path.unshift(
            `${n.tagName}:${Array.prototype.indexOf.call(n.parentElement?.children ?? [], n)}`,
          );
        return path.join('/');
      }
      function scrolls() {
        const boxes = [];
        for (const el of document.querySelectorAll('#app *'))
          if (el.scrollTop || el.scrollLeft)
            boxes.push({ place: placeOf(el), top: el.scrollTop, left: el.scrollLeft });
        return { x: window.scrollX, y: window.scrollY, boxes };
      }
      function restoreScrolls(kept) {
        if (kept.boxes.length) {
          const byPlace = new Map(kept.boxes.map((b) => [b.place, b]));
          for (const el of document.querySelectorAll('#app *')) {
            const b = byPlace.get(placeOf(el));
            if (b) {
              el.scrollTop = b.top;
              el.scrollLeft = b.left;
            }
          }
        }
        window.scrollTo(kept.x, kept.y);
      }
      let pendingRender = false;
      document.addEventListener('focusout', () =>
        setTimeout(() => {
          if (pendingRender && document.activeElement?.tagName !== 'TEXTAREA') {
            pendingRender = false;
            render();
          }
        }, 0),
      );
      // The health details close on a click elsewhere, as a menu does.
      document.addEventListener('click', (e) => {
        const hp = document.querySelector('.hp');
        if (hp?.open && !hp.contains(e.target)) {
          hp.open = false;
          opened.delete('health');
        }
      });
      window.addEventListener('hashchange', () => {
        scrolledTo = null;
        render();
      });
      const events = new EventSource('/events');
      events.onmessage = (m) => {
        document.getElementById('problem').textContent = '';
        view = JSON.parse(m.data);
        render();
      };
      events.addEventListener('problem', (m) => {
        document.getElementById('problem').textContent = JSON.parse(m.data);
      });
      events.onerror = () => {
        document.getElementById('problem').textContent =
          'Lost the Factory UI; reconnecting… (task factory:ui:open)';
      };
      setInterval(() => {
        for (const t of document.querySelectorAll('[data-since]'))
          t.textContent = (t.dataset.prefix || '') + ago(t.dataset.since);
      }, 1000);
    </script>
  </body>
</html>
