# The agent worker is memory-constrained (4 CPUs, ~2 GB free): keep the build small.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
# Compile Kotlin inside the Gradle daemon instead of a separate Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.nonTransitiveRClass=true
