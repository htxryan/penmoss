# The agent worker shares 11 GB between lanes: keep the build small.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The JGit the JVM runner uses (-PjgitVersion=… to compare). The APK flavors pin their own.
jgitVersion=6.6.1.202309021850-r
