<link rel="preconnect" href="https://fonts.googleapis.com" />
<link

/>
<style>

  :root {
    --bg: #f3f5f2;
    --surface: #ffffff;
    --ink: #18211d;
    --muted: #5b6862;
    --line: #c9d2cd;
    --band: #e8ece8;
    --ok: #1d8656;
    --ok-soft: #dcefe4;
    --run: #2a63cf;
    --run-soft: #dde7fa;
    --todo: #8e9a94;
    --todo-soft: #eceeec;
    --bug: #d3362a;
    --bug-soft: #fbe2df;
    --na: #b0a894;
    --display: 'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Public Sans', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #111613;
      --surface: #19201c;
      --ink: #e3eae6;
      --muted: #93a29a;
      --line: #33403a;
      --band: #161d19;
      --ok: #3cc386;
      --ok-soft: #173327;
      --run: #6f9dff;
      --run-soft: #1b2843;
      --todo: #6c7a73;
      --todo-soft: #1e2622;
      --bug: #ff5b4b;
      --bug-soft: #3a1c19;
      --na: #7f7867;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #111613;
    --surface: #19201c;
    --ink: #e3eae6;
    --muted: #93a29a;
    --line: #33403a;
    --band: #161d19;
    --ok: #3cc386;
    --ok-soft: #173327;
    --run: #6f9dff;
    --run-soft: #1b2843;
    --todo: #6c7a73;
    --todo-soft: #1e2622;
    --bug: #ff5b4b;
    --bug-soft: #3a1c19;
    --na: #7f7867;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--body);
  }
  .wrap {
    max-width: 1320px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 28px 48px;
    display: grid;
    gap: 22px;
  }
  header {
    display: grid;
    gap: 10px;
  }
  .eyebrow {
    font: 500 12px var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font: 700 clamp(26px, 4vw, 38px)/1.1 var(--display);
    margin: 0;
    text-wrap: balance;
  }
  h2 {
    font: 600 19px/1.2 var(--display);
    margin: 0 0 10px;
  }
  .now {
    max-width: 75ch;
    color: var(--muted);
    margin: 0;
  }
  .now b {
    color: var(--ink);
    font-weight: 600;
  }
  .tallies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tally {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px 5px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    font: 500 13px var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
  }
  .d-ok {
    background: var(--ok);
  }
  .d-run {
    background: var(--run);
  }
  .d-todo {
    background: var(--todo);
  }
  .d-bug {
    background: var(--bug);
  }
  .d-fix {
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--bug);
  }
  .d-na {
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--na);
  }
  .map {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow-x: auto;
  }
  .map svg {
    display: block;
    width: 100%;
    min-width: 980px;
    height: auto;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px 20px;
    font-size: 13px;
    color: var(--muted);
    padding: 12px 16px;
    border-top: 1px solid var(--line);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .cols {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .cols {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    min-width: 0;
  }
  ol.steps {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 2px;
  }
  ol.steps li {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: baseline;
    padding: 6px 4px;
    border-bottom: 1px solid var(--band);
  }
  ol.steps li:last-child {
    border-bottom: 0;
  }
  .n {
    font: 500 12px var(--mono);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .steps .what {
    min-width: 0;
  }
  .steps .what small {
    display: block;
    color: var(--muted);
    font-size: 13px;
  }
  .chip {
    font: 500 11px var(--mono);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .c-ok {
    background: var(--ok-soft);
    color: var(--ok);
  }
  .c-run {
    background: var(--run-soft);
    color: var(--run);
  }
  .c-todo {
    background: var(--todo-soft);
    color: var(--muted);
  }
  .c-bug {
    background: var(--bug-soft);
    color: var(--bug);
  }
  .c-na {
    background: transparent;
    color: var(--na);
    box-shadow: inset 0 0 0 1px var(--na);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .tbl {
    overflow-x: auto;
  }
  th {
    text-align: left;
    font: 500 11px var(--mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--band);
    vertical-align: top;
  }
  td.where {
    font: 400 12px var(--mono);
    color: var(--muted);
    white-space: nowrap;
  }
  tr.sel td {
    background: var(--band);
  }
  .detail {
    display: grid;
    gap: 6px;
  }
  .detail h3 {
    font: 600 17px var(--display);
    margin: 0;
  }
  .detail ul {
    margin: 0;
    padding-left: 18px;
  }
  .detail li {
    margin: 2px 0;
  }
  .updated {
    font: 400 12px var(--mono);
    color: var(--muted);
  }

  /* the map */
  .band-bg {
    fill: var(--band);
  }
  .band-label {
    fill: var(--muted);
    font: 500 11px var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .node rect.box {
    fill: var(--surface);
    stroke: var(--line);
    stroke-width: 1.2;
  }
  .node .stripe {
    stroke: none;
  }
  .node text.t {
    fill: var(--ink);
    font: 600 14px var(--display);
  }
  .node text.s {
    fill: var(--muted);
    font: 400 11px var(--mono);
  }
  .node {
    cursor: pointer;
  }
  .node:focus {
    outline: none;
  }
  .node:focus rect.box,
  .node.sel rect.box {
    stroke: var(--ink);
    stroke-width: 2;
  }
  .st-ok .stripe {
    fill: var(--ok);
  }
  .st-run .stripe {
    fill: var(--run);
  }
  .st-todo .stripe {
    fill: var(--todo);
  }
  .st-bug .stripe {
    fill: var(--bug);
  }
  .st-na .stripe {
    fill: var(--na);
  }
  .st-na rect.box {
    stroke-dasharray: 4 4;
  }
  .halo {
    fill: none;
    stroke-width: 2;
    opacity: 0;
  }
  .st-run .halo {
    stroke: var(--run);
    animation: halo 2.4s ease-in-out infinite;
  }
  .st-bug .halo {
    stroke: var(--bug);
    animation: halo 1.6s ease-in-out infinite;
  }
  @keyframes halo {
    0%,
    100% {
      opacity: 0;
    }
    50% {
      opacity: 0.9;
    }
  }
  .edge {
    fill: none;
    stroke-width: 2;
  }
  .e-ok {
    stroke: var(--ok);
    stroke-dasharray: 2 9;
    stroke-linecap: round;
    stroke-width: 3;
    animation: flow 1.8s linear infinite;
  }
  .e-run {
    stroke: var(--run);
    stroke-dasharray: 7 7;
    animation: flow 0.9s linear infinite;
  }
  .e-todo {
    stroke: var(--todo);
    stroke-dasharray: 3 6;
    opacity: 0.75;
  }
  .e-bug {
    stroke: var(--bug);
    stroke-dasharray: 7 7;
    animation: flow 0.9s linear infinite;
  }
  .e-na {
    stroke: var(--na);
    stroke-dasharray: 1 6;
    opacity: 0.6;
  }
  .edge-under {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    opacity: 0.5;
  }
  @keyframes flow {
    to {
      stroke-dashoffset: -22;
    }
  }
  .stepno circle {
    stroke-width: 1.5;
    fill: var(--surface);
  }
  .stepno text {
    font: 600 10px var(--mono);
    text-anchor: middle;
    dominant-baseline: central;
  }
  .sn-ok circle {
    stroke: var(--ok);
  }
  .sn-ok text {
    fill: var(--ok);
  }
  .sn-run circle {
    stroke: var(--run);
  }
  .sn-run text {
    fill: var(--run);
  }
  .sn-todo circle {
    stroke: var(--todo);
  }
  .sn-todo text {
    fill: var(--muted);
  }
  .sn-bug circle {
    stroke: var(--bug);
  }
  .sn-bug text {
    fill: var(--bug);
  }
  .sn-na circle {
    stroke: var(--na);
  }
  .sn-na text {
    fill: var(--na);
  }
  .arrow-ok {
    fill: var(--ok);
  }
  .arrow-run {
    fill: var(--run);
  }
  .arrow-todo {
    fill: var(--todo);
  }
  .arrow-bug {
    fill: var(--bug);
  }
  .arrow-na {
    fill: var(--na);
  }
  .bugdot {
    fill: var(--bug);
  }
  .bugring {
    fill: var(--surface);
    stroke: var(--bug);
    stroke-width: 2;
  }
  .bugpulse {
    fill: var(--bug);
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 1.6s ease-out infinite;
  }
  .bugcount {
    fill: #fff;
    font: 600 9px var(--mono);
    text-anchor: middle;
    dominant-baseline: central;
  }
  .bugcount.ring {
    fill: var(--bug);
  }
  @keyframes pulse {
    0% {
      transform: scale(1);
      opacity: 0.55;
    }
    100% {
      transform: scale(2.6);
      opacity: 0;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .e-ok,
    .e-run,
    .e-bug,
    .halo,
    .bugpulse {
      animation: none !important;
    }
    .st-run .halo,
    .st-bug .halo {
      opacity: 0.6;
    }
    .bugpulse {
      opacity: 0;
    }
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Software factory · first real run · PEN-75</div>
    <h1>Factory test map</h1>
    <p class="now" id="now"></p>
    <div class="tallies" id="tallies"></div>
    <div class="updated" id="updated"></div>
  </header>

  <section class="map" aria-label="Components and data flow">
    <svg
      id="svg"
      viewBox="0 0 1260 760"
      role="img"
      aria-label="The factory's components in three bands, with numbered data-flow steps coloured by validation state"
    ></svg>
    <div class="legend">
      <span><i class="dot d-ok"></i>Validated</span>
      <span><i class="dot d-run"></i>In progress</span>
      <span><i class="dot d-todo"></i>Left to validate</span>
      <span><i class="dot d-bug"></i>Bug open / being fixed</span>
      <span><i class="dot d-fix"></i>Bug fixed, retest pending</span>
      <span><i class="dot d-na"></i>Not exercised by this card</span>
      <span>Click a box for its evidence.</span>
    </div>
  </section>

  <section class="panel detail" id="detail" aria-live="polite"></section>

  <div class="cols">
    <section class="panel">
      <h2>The run, step by step</h2>
      <ol class="steps" id="steps"></ol>
    </section>
    <section class="panel">
      <h2>Bugs found</h2>
      <div class="tbl">
        <table>
          <thead>
            <tr>
              <th>Bug</th>
              <th>Where</th>
              <th>State</th>
            </tr>
          </thead>
          <tbody id="bugs"></tbody>
        </table>
      </div>
    </section>
  </div>
</div>

  /* ===== rendering ===== */
  const W = 170,
    H = 76,
    NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  const byId = Object.fromEntries(STATE.nodes.map((n) => [n.id, n]));
  const bugById = Object.fromEntries(STATE.bugs.map((b) => [b.id, b]));
  const label = {
    ok: 'Validated',
    run: 'In progress',
    todo: 'To validate',
    bug: 'Bug',
    fix: 'Fixed · retest',
    na: 'Not in scope',
  };
  const el = (tag, attrs = {}, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.appendChild(e);
    return e;
  };
  let selected = 'gate';

  function bands() {
    [
      ['Services', 20, 190],
      ["Ryan's Mac · the host", 280, 190],
      ['Sandboxes · Seatbelt', 540, 200],
    ].forEach(([t, y, h]) => {
      el('rect', { x: 10, y, width: 1240, height: h, rx: 8, class: 'band-bg' });
      el('text', { x: 24, y: y + 22, class: 'band-label' }).textContent = t;
    });
  }

  function anchor(n, toward) {
    const cx = n.x + W / 2,
      cy = n.y + H / 2,
      tx = toward.x + W / 2,
      ty = toward.y + H / 2;
    if (Math.abs(ty - cy) > 60) return ty > cy ? [cx, n.y + H, 0, 1] : [cx, n.y, 0, -1];
    return tx > cx ? [n.x + W, cy, 1, 0] : [n.x, cy, -1, 0];
  }

  function edges() {
    const defs = el('defs');
    for (const s of ['ok', 'run', 'todo', 'bug', 'na']) {
      const m = el(
        'marker',
        {
          id: 'a-' + s,
          viewBox: '0 0 10 10',
          refX: 9,
          refY: 5,
          markerWidth: 7,
          markerHeight: 7,
          orient: 'auto-start-reverse',
        },
        defs,
      );
      el('path', { d: 'M0,0 L10,5 L0,10 z', class: 'arrow-' + s }, m);
    }
    const g = el('g');
    for (const e of STATE.edges) {
      if (e.from === e.to) continue;
      const a = byId[e.from],
        b = byId[e.to];
      let [x1, y1, dx1, dy1] = anchor(a, b),
        [x2, y2, dx2, dy2] = anchor(b, a);
      if (e.dx) {
        x1 += e.dx;
        x2 += e.dx;
      }
      const k = Math.max(50, Math.hypot(x2 - x1, y2 - y1) / 2.6);
      let c1 = [x1 + dx1 * k, y1 + dy1 * k],
        c2 = [x2 + dx2 * k, y2 + dy2 * k];
      if (e.bend) {
        c1[1] += e.bend;
        c2[1] += e.bend;
      }
      const d = `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`;
      el('path', { d, class: 'edge-under' }, g);
      const p = el('path', { d, class: 'edge e-' + e.st, 'marker-end': `url(#a-${e.st})` }, g);
      const t = el('title', {}, p);
      t.textContent = `${e.n}. ${e.label}: ${e.detail}`;
      const L = p.getTotalLength(),
        m = p.getPointAtLength(L * 0.5);
      const s = el('g', { class: 'stepno sn-' + e.st }, g);
      el('circle', { cx: m.x, cy: m.y, r: e.n === 'UI' ? 13 : 11 }, s);
      el('text', { x: m.x, y: m.y }, s).textContent = e.n;
      el('title', {}, s).textContent = `${e.n}. ${e.label}: ${e.detail}`;
    }
  }

  function nodes() {
    for (const n of STATE.nodes) {
      const g = el('g', {
        class: `node st-${n.st}`,
        tabindex: 0,
        role: 'button',
        'data-id': n.id,
        'aria-label': `${n.title}: ${label[n.st]}`,
      });
      el(
        'rect',
        { x: n.x - 5, y: n.y - 5, width: W + 10, height: H + 10, rx: 11, class: 'halo' },
        g,
      );
      el('rect', { x: n.x, y: n.y, width: W, height: H, rx: 7, class: 'box' }, g);
      el('rect', { x: n.x, y: n.y + 8, width: 4, height: H - 16, rx: 2, class: 'stripe' }, g);
      el('text', { x: n.x + 16, y: n.y + 29, class: 't' }, g).textContent = n.title;
      el('text', { x: n.x + 16, y: n.y + 50, class: 's' }, g).textContent = n.sub;
      const open = (n.bugs || []).filter((b) => bugById[b].st === 'bug').length;
      const fixed = (n.bugs || []).filter((b) => bugById[b].st === 'fix').length;
      let bx = n.x + W - 4;
      if (open) {
        el('circle', { cx: bx, cy: n.y + 4, r: 9, class: 'bugpulse' }, g);
        el('circle', { cx: bx, cy: n.y + 4, r: 9, class: 'bugdot' }, g);
        el('text', { x: bx, y: n.y + 4.5, class: 'bugcount' }, g).textContent = open;
        bx -= 24;
      }
      if (fixed) {
        el('circle', { cx: bx, cy: n.y + 4, r: 8, class: 'bugring' }, g);
        el('text', { x: bx, y: n.y + 4.5, class: 'bugcount ring' }, g).textContent = fixed;
      }
      g.addEventListener('click', () => select(n.id));
      g.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          select(n.id);
        }
      });
    }
  }

  function chip(st) {
    const c = { ok: 'c-ok', run: 'c-run', todo: 'c-todo', bug: 'c-bug', fix: 'c-bug', na: 'c-na' }[
      st
    ];
    return `<span class="chip ${c}">${label[st]}</span>`;
  }

  function select(id) {
    selected = id;
    document
      .querySelectorAll('.node')
      .forEach((g) => g.classList.toggle('sel', g.dataset.id === id));
    const n = byId[id];
    const bugs = (n.bugs || []).map((b) => bugById[b]);
    document.getElementById('detail').innerHTML =
      `<div class="eyebrow">Selected</div><h3>${n.title} ${chip(n.st)}</h3>
    <ul>${n.notes.map((t) => `<li>${t}</li>`).join('')}</ul>
    ${bugs.length ? `<div class="eyebrow" style="margin-top:6px">Bugs here</div><ul>${bugs.map((b) => `<li>${b.id} · ${b.what} ${chip(b.st)} <span class="updated">${b.fix}</span></li>`).join('')}</ul>` : ''}`;
    document
      .querySelectorAll('#bugs tr')
      .forEach((tr) => tr.classList.toggle('sel', tr.dataset.where === id));
  }

  function lists() {
    document.getElementById('steps').innerHTML = STATE.edges
      .filter((e) => !e.nolist)
      .map(
        (e) =>
          `<li><span class="n">${String(e.n).padStart(2, '0')}</span><span class="what">${e.label}<small>${e.detail}</small></span>${chip(e.st)}</li>`,
      )
      .join('');
    document.getElementById('bugs').innerHTML = STATE.bugs
      .map(
        (b) =>
          `<tr data-where="${b.where}"><td>${b.id} · ${b.what}</td><td class="where">${byId[b.where].title}</td><td>${chip(b.st)} <span class="updated">${b.fix}</span></td></tr>`,
      )
      .join('');
    const steps = STATE.edges.filter((e) => !e.nolist);
    const count = (st) => steps.filter((e) => e.st === st).length;
    const bugs = (st) => STATE.bugs.filter((b) => b.st === st).length;
    document.getElementById('tallies').innerHTML = [
      ['d-ok', `${count('ok')} steps validated`],
      ['d-run', `${count('run') + count('bug')} in progress`],
      ['d-todo', `${count('todo')} left`],
      ['d-bug', `${bugs('bug')} bugs open`],
      ['d-fix', `${bugs('fix')} fixed, retest`],
      ['d-ok', `${bugs('ok')} bugs verified fixed`],
    ]
      .map(([c, t]) => `<span class="tally"><i class="dot ${c}"></i>${t}</span>`)
      .join('');
    document.getElementById('now').innerHTML = STATE.now;
    document.getElementById('updated').textContent = 'Updated ' + STATE.updated;
  }

  bands();
  edges();
  nodes();
  lists();
  select(selected);
</script>
