# The agent worker is shared (4 CPUs, ~7 GB): a capped heap, two workers, no parallel
# project execution, and Kotlin compiled inside the Gradle daemon (W5). CI uses the same.
# The release build's lint (lintVitalAnalyzeRelease, which the public APK runs, A1187) needs more
# metaspace than 512 MB: it ran out there on 7 Nov 2026.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.nonTransitiveRClass=true
