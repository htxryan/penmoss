# Sized for CI's hosted runner (4 CPUs, 16 GB, A1235) and this Mac, which several sessions share
# (W12): a capped heap, four workers, the projects built in parallel, so engine-git's slow tests run
# beside the app's compile and tests rather than before them, and Kotlin compiled inside the
# Gradle daemon (A1523, amending A288's cap for the shared worker). CI uses the same.
# The release build's lint (lintVitalAnalyzeRelease, which the public APK runs, A1187) needs more
# metaspace than 512 MB: it ran out there on 7 Nov 2026.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.nonTransitiveRClass=true
