# Android 17 (API 37), the app's minSdk and targetSdk (A835): Robolectric 4.17 knows it (android-all 17-robolectric-15733970).
sdk=37
# A plain Application, not PenmossApp, whose onCreate opens the file-backed database and starts the
# device graph's work for every test (A1522). A test of the activities, which read `context.graph`,
# says `@Config(application = PenmossApp::class)` and hands the app a graph of its own (`useGraph`).
application=android.app.Application
